[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Vòng 53: dep `textvn-core` PATH (core + strategy đều 0 crate ngoài) để gen-vocab
# dùng đúng một nguồn sự thật `is_valid_word` / `normalize_tone` (thay script Python
# vi phạm ngôn ngữ policy). Parser TOML ở đây chỉ cần đúng schema
# `data/tables/*.toml` (xem `toml.rs`).
# E59 (port tools/assist/*.py): thêm `textvn-assist` + `textvn-dict` PATH — đo
# recall/FPR bằng CHÍNH engine sản phẩm trong tiến trình (loại lớp lỗi "binary CLI
# cũ" Fassist-120); vẫn 0 crate crates.io. Semantics pháp `--dic` copy
# `cli/src/assist.rs` (một nguồn sự thật luật nạp từ điển).
[dependencies]
textvn-core = { path = "../core" }
textvn-assist = { path = "../assist" }
textvn-dict = { path = "../dict" }
# BOARD-1 (E83): `board` tách thành crate độc lập (chỉ std) — `cargo xtask board` mượn
# lib; khi workspace sản phẩm hỏng vì WIP, điều phối vẫn chạy qua `cargo run -p textvn-board`
# hoặc `cargo board` (cargo install --path board).
textvn-board = { path = "../board" }

[[bin]]
name = "xtask"
path = "src/main.rs"
