[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Vòng 53: duy nhất một dep — `textvn-core` PATH (core + strategy đều 0 crate
# ngoài) để gen-vocab dùng đúng một nguồn sự thật `is_valid_word` /
# `normalize_tone` (thay script Python vi phạm ngôn ngữ policy). Parser TOML ở
# đây chỉ cần đúng schema `data/tables/*.toml` (xem `toml.rs`).
[dependencies]
textvn-core = { path = "../core" }

[[bin]]
name = "xtask"
path = "src/main.rs"
