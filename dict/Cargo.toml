[package]
name = "textvn-dict"
version.workspace = true
edition.workspace = true
license.workspace = true

# KHÔNG dependency bat buoc: crate này tự viết FST + mmap bằng FFI thuần của OS
# (Windows `CreateFileMapping`/`MapViewOfFile`, macOS/Linux `mmap`) — không
# cần `memmap2`/`fst` (P4-0 D15/D32: `assist` giữ 0-dep; crate này cũng 0-dep
# để không kéo dependency mới vào lockfile + `cargo deny`).
#
# Ngoại lệ: provider spell-check của OS:
# - `src/os_windows.rs` (Windows Spell Checking API) dùng crate `windows` —
#   optional + target-specific (`cfg(windows)`) nên Linux/macOS KHÔNG build nó.
# - `src/os_linux.rs` (Linux/enchant-2) KHÔNG dùng crate nào: FFI thuần với
#   `#[link(name = "enchant-2")]`, chỉ link khi feature `os-enchant` bật (mặc
#   định TẮT ⇒ `cargo check`/test/CI không cần libenchant, không link C); không
#   cần crate `libc` vì không symbol `enchant_*` nào trùng symbol runtime std
#   (Fassist-104). Build gói Linux (máy có `libenchant-2-dev`) mới bật feature.

[features]
# - `os-spell`: Windows Spell Checking API (crate `windows`). Mặc định bật để
#   `cargo test`/`clippy --all-targets` phủ module; trên Linux/macOS dependency
#   `windows` (target-specific) không được build nên không ảnh hưởng gì.
# - `os-enchant`: Linux provider enchant-2 — MẶC ĐỊNH TẮT (CI không có
#   libenchant). Bật `--features os-enchant` trên máy Linux có libenchant-2
#   (link động LGPL-2.1+); nếu không có dict `vi` thì provider vẫn fail-open
#   (`NoDictionary`) ⇒ không báo lỗi spelling.
# - `os-macos`: macOS provider NSSpellChecker (AppKit) qua runtime Objective-C
#   thuần. MẶC ĐỊNH TẮT (CI không có macOS). Bật `--features os-macos` trên macOS.
default = ["os-spell"]
os-spell = ["dep:windows"]
os-enchant = []
os-macos = []

[dependencies]
textvn-assist = { path = "../assist" }

[target.'cfg(windows)'.dependencies]
# Chỉ 2 feature cần cho Spell Checking API (P4-10 §2.1):
# - `Win32_Globalization`: ISpellCheckerFactory/ISpellChecker/ISpellingError +
#   hằng `SpellCheckerFactory`.
# - `Win32_System_Com`: `Suggest` (trả `IEnumString`) + CoCreateInstance/CoInitializeEx.
# `default-features = false`: không kéo toàn bộ Win32/WinRT vào binary.
windows = { version = "0.61", optional = true, default-features = false, features = [
    "Win32_Globalization",
    "Win32_System_Com",
] }
