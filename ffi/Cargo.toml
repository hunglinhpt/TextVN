[package]
name = "textvn-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

# P0-1 §1 liệt kê ["staticlib","cdylib"]; bổ sung "rlib" để `textvn-cli` và
# integration test link được (Rust không depend được crate chỉ có staticlib/cdylib).
# → P0-1 §1 cập nhật theo (2026-09-27, ghi ở 00-INDEX §5).
[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
textvn-core = { path = "../core" }
textvn-config = { path = "../config" }
textvn-strategy = { path = "../strategy" }
textvn-appdb = { path = "../appdb" }
