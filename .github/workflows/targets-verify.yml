# WIN-061 - verify targets tren 2 runner image + upgrade-cycle tren CI.
# Quy tac 2026-09-27: KHONG cai/update/downgrade app tren may local - runner tu huy sau job.
# Dispatch-only (giong hook-spike) - khong gate PR.
name: targets-verify

on:
  workflow_dispatch:
    inputs:
      vscode_old_version:
        description: 'VS Code phien ban cu dung cho upgrade-cycle baseline'
        required: false
        default: '1.137.0'

permissions:
  contents: read

jobs:
  # Cung 1 bo JSON phai resolve tren 2 image (Edge/Chrome/Notepad/VS Code khac version) =
  # chung minh locator khong veo theo version app - khong can cai gi.
  cross-image:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: check_targets (static schema)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\win\check_targets.ps1
      - name: verify_targets (live probe)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\win\verify_targets.ps1 -OutMd verify-evidence-${{ matrix.os }}.md
      - name: upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-cross-${{ matrix.os }}
          path: verify-evidence-${{ matrix.os }}.md
          if-no-files-found: ignore

  # Acceptance WIN-061 #2: chay lai sau upgrade app version khong vef.
  # Tat ca tren runner epheeral: cai ban cu -> verify -> upgrade ban moi -> verify lai.
  # Khong dung winget (f6-11: source msstore/winget hay hong tren runner fresh,
  # loi 0x8a15000f/0x8a150042) - truc tiep tai .exe tu manifest winget-pkgs + trang chinh thuc.
  upgrade-cycle:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: install VS Code old version (runner disposable, direct download)
        shell: powershell
        env:
          OLD_V: ${{ inputs.vscode_old_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $old = $env:OLD_V
          $dir = Join-Path $env:RUNNER_TEMP 'vscode_dl'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          # URL ban cu lay tu manifest winget-pkgs tren GitHub raw (khong qua winget CLI)
          $manifest = 'https://raw.githubusercontent.com/microsoft/winget-pkgs/master/manifests/m/Microsoft/VisualStudioCode/' + $old + '/Microsoft.VisualStudioCode.installer.yaml'
          $yaml = (Invoke-WebRequest -UseBasicParsing $manifest).Content
          $m = [regex]::Match($yaml, 'InstallerUrl:\s*(\S*VSCodeUserSetup-x64-\d\S*\.exe)')
          if (-not $m.Success) { Write-Error 'khong tim thay VSCodeUserSetup-x64 URL trong manifest'; exit 1 }
          $urlOld = $m.Groups[1].Value
          Write-Output ('old url = ' + $urlOld)
          $exeOld = Join-Path $dir 'VSCodeUserSetup-old.exe'
          curl.exe -L -sS -o $exeOld $urlOld
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # user scope -> %LOCALAPPDATA%\Programs\Microsoft VS Code = paths[1] cua vscode.json
          $p = Start-Process $exeOld -ArgumentList '/VERYSILENT','/NORESTART','/MERGETASKS=!runcode' -Wait -PassThru
          Write-Output ('install old exit = ' + $p.ExitCode)
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { exit $p.ExitCode }
          # Runner epheeral: neu van con VS Code o Program Files (ban khac version) thi xoa
          # - de verify khong cham vao ban do (paths[0] = Program Files).
          $pf = 'C:\Program Files\Microsoft VS Code'
          if (Test-Path "$pf\Code.exe") {
            $v = (Get-Item "$pf\Code.exe").VersionInfo.ProductVersion
            if ($v -notlike ($old + '*')) {
              Remove-Item $pf -Recurse -Force
              Write-Output ('da xoa ban khac ' + $v + ' o Program Files')
            }
          }
          exit 0
      - name: verify baseline (before upgrade)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\win\verify_targets.ps1 -Only vscode -OutMd verify-before.md
      - name: upgrade VS Code (direct download, direct install)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Code dang chay sau verify baseline -> dong truoc khi Inno ghi file
          Get-Process Code -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $dir = Join-Path $env:RUNNER_TEMP 'vscode_dl'
          $exeNew = Join-Path $dir 'VSCodeUserSetup-new.exe'
          # ban moi nhat: trang chinh thuc redirect -> CDN stable (user installer cung thu muc = upgrade in-place)
          curl.exe -L -sS -o $exeNew 'https://code.visualstudio.com/sha/download?build=stable&os=win32-x64-user'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $p = Start-Process $exeNew -ArgumentList '/VERYSILENT','/NORESTART','/MERGETASKS=!runcode' -Wait -PassThru
          Write-Output ('upgrade exit = ' + $p.ExitCode)
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { exit $p.ExitCode }
          exit 0
      - name: verify after upgrade
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\win\verify_targets.ps1 -Only vscode -OutMd verify-after.md
      - name: compare before/after
        shell: powershell
        env:
          OLD_V: ${{ inputs.vscode_old_version }}
        run: |
          $b = Get-Content verify-before.md -Raw
          $a = Get-Content verify-after.md -Raw
          $vb = 'MISS'; $va = 'MISS'
          if ($b -match '\|\s*vscode\s*\|\s*OK\s*\|\s*([^\s|]+)') { $vb = $Matches[1] }
          if ($a -match '\|\s*vscode\s*\|\s*OK\s*\|\s*([^\s|]+)') { $va = $Matches[1] }
          $sum = @()
          $sum += '### WIN-061 upgrade-cycle (runner epheeral)'
          $sum += ''
          $sum += '- before: vscode **' + $vb + '** (mong doi: ' + $env:OLD_V + ')'
          $sum += '- after : vscode **' + $va + '** (da upgrade)'
          $sum += '- locator truoc/sau deu OK = khong veo sau upgrade'
          $sum += ''
          $sum += '| | status | version | field | hit | resolves | ms |'
          $sum += '|---|---|---|---|---|---|---|'
          foreach ($line in ($a -split "`r?`n" | Where-Object { $_ -match '^\|\s*vscode' })) { $sum += $line }
          $sum | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($vb -eq 'MISS') { Write-Error 'baseline khong OK'; exit 1 }
          if ($va -eq 'MISS') { Write-Error 'sau upgrade khong OK'; exit 1 }
          if ($vb -ne $env:OLD_V) { Write-Error ('ban cu khong tai duoc (thay ' + $vb + ')'); exit 1 }
          if ($vb -eq $va) { Write-Error ('khong upgrade duoc (' + $va + ')'); exit 1 }
          Write-Output ('PASS: upgrade ' + $vb + ' -> ' + $va + ', locator khong veo')
          exit 0
      - name: upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-upgrade-cycle
          path: verify-*.md
          if-no-files-found: ignore
