# Spikes (dispatch-only, KHONG gate PR/push) - spikes/README.md.
# Thay hook-spike.yml (WIN-005): cung probe, nay chay tren ma tran runner hien tai + SPK-ARM64X.
#   runner-probe   SPK-RUNNER: desktop session + SendInput + UIA tren windows-2022/2025/11-arm
#                  (COMPAT-1, ARM-W5 - harness e2e co chay duoc tren runner moi khong).
#   arm64x-*       SPK-ARM64X: forwarder ARM64X cho TIP, nap tu tien trinh x64 gia lap + ARM64
#                  native tren windows-11-arm (ARM-W2/ARM-W3).
#   (SPK-RSI da hap thu vao tools/bench dream-rsi 2026-11-28; tat ding da architectures
#    PERF-2 chuyen sang ci-shared - khong con job rsi-oracle/rsi-determinism o day.)
name: spikes

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spikes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-probe:
    name: SPK-RUNNER (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Hook/SendInput/UIA probe
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File spikes\hook-probe\hook_probe.ps1
      - name: Show probe output
        if: always()
        shell: powershell
        run: Get-Content (Join-Path $env:TEMP 'hook_probe_out.txt') -ErrorAction SilentlyContinue
      - name: Upload probe output
        if: always()
        shell: powershell
        run: Copy-Item (Join-Path $env:TEMP 'hook_probe_out.txt') (Join-Path $env:RUNNER_TEMP 'hook_probe_out.txt') -ErrorAction SilentlyContinue
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spk-runner-${{ matrix.os }}
          path: ${{ runner.temp }}/hook_probe_out.txt
          if-no-files-found: warn

  arm64x-build:
    name: SPK-ARM64X build (x64 host, cross ARM64 + ARM64X link)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc
      - name: Build tsf-min x64/arm64 + probes + ARM64X forwarder
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File spikes\arm64x-forwarder\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: spk-arm64x-out
          path: target/spikes/arm64x-out
          if-no-files-found: error

  arm64x-run:
    name: SPK-ARM64X run (windows-11-arm)
    needs: arm64x-build
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: spk-arm64x-out
          path: target/spikes/arm64x-out
      - name: Probe x64 (emulated) + ARM64 (native) through the ARM64X forwarder
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File spikes\arm64x-forwarder\run.ps1
