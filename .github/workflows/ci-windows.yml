# CI riêng Windows (tách khỏi ci-shared 2026-10-11 — README hiện badge từng nền tảng:
# Windows / Linux / macOS). Phạm vi: code cfg(windows) (tray, TSF, hook, cli) + gói phát
# hành Windows chạy THẬT trên runner (portable, Inno machine/user, Store validation, MSIX).
# Job giữ NGUYÊN tên như khi còn trong ci-shared.
name: ci-windows

on:
  push:
    branches: [main]
    # Push chỉ chứa docs/graphify không đổi code — đừng đốt runner Windows.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'graphify-out/**'
      # E86: tệp điều phối nhiều agent (board.jsonl, changes/*.md) đổi liên tục — không đốt runner,
      # không đẩy run code đang chờ ra khỏi concurrency group.
      - 'coordination/**'
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Log không bao giờ chứa nội dung phím (S2) — biến này để tắt log nóng của engine.
  RUST_LOG: warn

permissions:
  contents: read

concurrency:
  # E86: push lên main = MỘT nhóm cho MỖI commit (github.sha) — trước đây nhóm theo ref giữ 1 run chạy + 1 run
  # chờ, run chờ mới thay run chờ cũ ⇒ khi nhiều agent cùng đẩy, commit code mất run CI (không có bằng chứng).
  # PR vẫn chung nhóm theo ref và huỷ run cũ.
  group: ci-windows-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  # main KHÔNG cancel-in-progress (giữ bằng chứng xanh cho từng commit); PR thì cancel.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  clippy-windows:
    # R2-84: code cfg(windows) (tray, TSF, hook, cli) chỉ được clippy trên Windows trong
    # build-release.ps1 — và bản mặc định LOẠI textvn-win-hook. Cross-check target
    # MSVC trên Linux (không link) phủ cả hook, nhanh, không cần runner Windows.
    name: clippy Windows target (cross-check, gồm hook)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-msvc -- -D warnings

  # ARM-W1 (P0-7 Luồng W): CÙNG bộ test chạy NATIVE trên Windows 11 ARM64 (Snapdragon X, Surface
  # Pro X, Windows Dev Kit) + build TIP/tray/CLI `aarch64-pc-windows-msvc` + kiểm PE (machine ARM64,
  # không VC++ runtime — R2-18). Không có hook trên ARM (quyết định chủ repo: TSF thuần). Đóng gói
  # ARM64X/bộ cài là ARM-W2…W4. Script nội tuyến ASCII-only (PowerShell 5.1 đọc ANSI — A5/E32).
  windows-arm64:
    name: Windows ARM64 native (windows-11-arm)
    runs-on: windows-11-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Runner must be ARM64
        shell: powershell
        run: |
          Write-Output "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          if ($env:PROCESSOR_ARCHITECTURE -ne 'ARM64') { throw 'runner is not ARM64' }
      - name: Rust stable with a NATIVE aarch64-pc-windows-msvc host
        shell: powershell
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $init = Join-Path $env:RUNNER_TEMP 'rustup-init.exe'
            Invoke-WebRequest -UseBasicParsing 'https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe' -OutFile $init
            & $init -y --profile minimal --default-toolchain stable --default-host aarch64-pc-windows-msvc
            if ($LASTEXITCODE -ne 0) { throw "rustup-init failed: $LASTEXITCODE" }
            Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:USERPROFILE '.cargo\bin')
          } else {
            rustup set default-host aarch64-pc-windows-msvc
            rustup toolchain install stable --profile minimal
            rustup default stable
          }
          rustup component add rustfmt clippy
          rustup target add x86_64-pc-windows-msvc i686-pc-windows-msvc
      - name: rustc host must be aarch64-pc-windows-msvc (no emulated x64 toolchain)
        shell: powershell
        run: |
          $vv = rustc -vV
          $vv | Write-Output
          if (-not ($vv -match 'host: aarch64-pc-windows-msvc')) { throw 'rustc host is not aarch64-pc-windows-msvc' }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows-arm64-v1
      - name: cargo test --workspace (native ARM64, no hook)
        run: cargo test --workspace --locked --exclude textvn-win-hook
      - name: verify header + ABI 20/532 + replay corpus TSF
        run: |
          cargo run -q -p textvn-cli -- verify
          cargo run -q -p textvn-cli -- sizes
          cargo run -q -p textvn-cli -- replay corpus/shared corpus/win --adapter tsf
      - name: PERF-1 — check perf baseline (aarch64-pc-windows-msvc)
        run: cargo run -q --release --locked -p textvn-bench -- check --auto
      - name: "PERF-1 — ghi số thật của runner + artifact (R2-176 baseline phải từ CI)"
        run: |
          cargo run -q --release --locked -p textvn-bench -- write --auto
          Get-Content perf\baseline-aarch64-pc-windows-msvc.json
      - uses: actions/upload-artifact@v4
        with:
          name: baseline-aarch64-windows
          path: perf/baseline-aarch64-pc-windows-msvc.json
          if-no-files-found: error
      - name: Inno Setup 6 (ARM-W4)
        shell: powershell
        run: |
          $dir86 = "${env:ProgramFiles(x86)}\Inno Setup 6"
          $dir64 = "${env:ProgramFiles}\Inno Setup 6"
          if (-not (Test-Path "$dir86\ISCC.exe") -and -not (Test-Path "$dir64\ISCC.exe")) {
            choco upgrade innosetup --no-progress -y | Out-Null
          }
          if (Test-Path "$dir86\ISCC.exe") {
            $dir86 | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } elseif (Test-Path "$dir64\ISCC.exe") {
            $dir64 | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            throw 'ISCC.exe not found after Inno Setup 6 install'
          }
      - name: ARM-W4 build-release.ps1 -Arch arm64 -SkipTests -BuildInstaller
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build-release.ps1 -Arch arm64 -SkipTests -BuildInstaller
      - name: ARM-W4 portable E2E (test-portable.ps1)
        shell: powershell
        run: |
          $zip = Get-ChildItem dist\TextVN-portable-*-windows-arm64-*.zip | Select-Object -First 1
          if (-not $zip) { throw 'ARM64 portable zip missing' }
          powershell -NoProfile -ExecutionPolicy Bypass -File installer\windows\tests\test-portable.ps1 -Zip $zip.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: ARM-W4 installer E2E (test-installer.ps1)
        shell: powershell
        run: |
          $setup = Get-ChildItem dist\TextVN-setup-*-windows-arm64.exe | Select-Object -First 1
          if (-not $setup) { throw 'ARM64 installer missing' }
          powershell -NoProfile -ExecutionPolicy Bypass -File installer\windows\tests\test-installer.ps1 -Setup $setup.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: textvn-windows-arm64-bins
          path: |
            target/aarch64-pc-windows-msvc/release/textvn-tsf.dll
            target/aarch64-pc-windows-msvc/release/textvn-tsf-arm64.dll
            target/aarch64-pc-windows-msvc/release/textvn-tsf-x64.dll
            target/aarch64-pc-windows-msvc/release/textvn-tsf-x86.dll
            target/aarch64-pc-windows-msvc/release/TextVN.exe
            target/aarch64-pc-windows-msvc/release/textvn-cli.exe
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS-*.txt
          if-no-files-found: warn

  windows-package:
    # Hai kịch bản người dùng trên Windows thật (runner GitHub, có desktop session — RW5
    # đã verify): (1) giải nén zip portable rồi chạy, (2) cài bằng Inno Setup im lặng
    # machine + kích hoạt user. Mỗi kịch bản gõ tiếng Việt THẬT qua TSF vào Notepad (SendInput VK) rồi gỡ.
    name: Windows package (${{ matrix.os }}, portable + installer, gõ TSF thật)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # STO-03/CI-03: khi chủ repo đặt repo VARIABLES (Settings -> Secrets and
      # variables -> Actions -> Variables) STORE_APP_NAME / STORE_PUBLISHER_NAME,
      # mọi bước validate sẽ đối chiếu ARP với GIÁ TRỊ THẬT trên Partner Center
      # thay vì so code .iss với chính nó. Chưa đặt -> rỗng -> harness dùng
      # mặc định (TextVN / Linh βùi dựng bằng [char]).
      STORE_APP_NAME: ${{ vars.STORE_APP_NAME }}
      STORE_PUBLISHER_NAME: ${{ vars.STORE_PUBLISHER_NAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: x86_64-pc-windows-msvc,i686-pc-windows-msvc
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: win-pkg-${{ matrix.os }}-v1
      - name: Inno Setup 6 (bản dịch tiếng Việt cần ≥ 6.5)
        shell: powershell
        run: |
          choco upgrade innosetup --no-progress -y | Out-Null
          $dir = "${env:ProgramFiles(x86)}\Inno Setup 6"
          if (-not (Test-Path "$dir\ISCC.exe")) { throw "ISCC.exe not found in $dir" }
          $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: build-release.ps1 (fmt, clippy, verify, replay, build, smoke, zip, installer)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build-release.ps1 -SkipTests -BuildInstaller
      - name: PERF-1 — ghi baseline-win.json thật của runner + artifact (R2-176)
        shell: powershell
        run: |
          cargo run -q --release --locked -p textvn-bench -- write --auto
          Get-Content perf\baseline-win.json
      - uses: actions/upload-artifact@v4
        with:
          name: baseline-x86_64-windows-${{ matrix.os }}
          path: perf/baseline-win.json
          if-no-files-found: error
      - name: Kịch bản 2 — giải nén ra dùng luôn (portable zip)
        shell: powershell
        run: |
          $zip = Get-ChildItem dist\TextVN-portable-*.zip | Select-Object -First 1
          powershell -NoProfile -ExecutionPolicy Bypass -File installer\windows\tests\test-portable.ps1 -Zip $zip.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Kịch bản 1 — cài đặt (Inno Setup machine + user activation)
        shell: powershell
        run: |
          $setup = Get-ChildItem dist\TextVN-setup-*.exe | Select-Object -First 1
          if (-not $setup) { throw 'installer was not built' }
          powershell -NoProfile -ExecutionPolicy Bypass -File installer\windows\tests\test-installer.ps1 -Setup $setup.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Gate BAT BUOC (Checklist S - store-submission.md): chay dung 3 buoc
      # manual package validation cua Microsoft tren runner sach: silent install
      # exit 0 khong tuong tac -> ARP name/publisher/version -> dung 1 entry
      # (bundleware) -> silent uninstall sach. Loi = do CI, khong duoc tag.
      - name: Store package validation (MS manual checks, bat buoc)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\win\validate-store-package.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Mo phong DUNG flow Microsoft Store validator tren CHINH ban vua build (R2-81):
      # file gan MOTW nhu vua tai -> chay silent -> check 3 muc.
      - name: Simulate Store validator (download + MOTW + silent + ARP + bundleware)
        shell: powershell
        # Hop thoai chan (vd. canh bao bao mat) tung treo ca job toi khi bi huy sau 60
        # phut (2026-10-09) - script tu gioi han 300 s, day la lop chan cuoi.
        timeout-minutes: 15
        run: |
          $setup = Get-ChildItem dist\TextVN-setup-*-windows-x64.exe | Where-Object { $_.Name -notlike '*-machine.exe' } | Select-Object -First 1
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\win\simulate-store-validation.ps1 -Setup $setup.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Context Matrix Test (audit vong 4 §3.4.3 / STO-02): runner GitHub chay
      # ELEVATED — dung moi truong do CHUNG MINH ban MAY (/DMachineInstall=1)
      # tao duoc entry ARP o HKLM/WOW6432Node (gia thuyet "validator chi doc
      # hive may"), ARP khop tung chu, va go cai sach. Xanh = ban may la lua
      # chon THAT khi VM Store duoc phep elevate; do = gia thuyet bat kha thi
      # trong VM do, phai di duong MSIX.
      - name: Machine-install variant (ARP o HKLM — bang chung cho STO-02)
        # Giai doan dau: chay de LAY BANG CHUNG (log) chu chua phai gate cung —
        # se doi sang blocking sau 2 run xanh lien tiep. Gate cung cho goi nop
        # van la buoc "Store package validation" o tren.
        continue-on-error: true
        shell: powershell
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          # Don sach entry TextVN con sot tu cac buoc truoc (uninstaller Inno
          # chay bat dong bo — cac harness dung truoc da doi, day la luoi an toan).
          $roots = @(
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall',
            'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
          )
          foreach ($r in $roots) {
            Get-ChildItem $r -ErrorAction SilentlyContinue | ForEach-Object {
              $p = Get-ItemProperty $_.PSPath -ErrorAction SilentlyContinue
              if ($p.DisplayName -like '*TextVN*') {
                Write-Host "Don entry con sot: $($_.PSPath)"
                Remove-Item $_.PSPath -Recurse -Force -ErrorAction SilentlyContinue
              }
            }
          }
          & $iscc "/DMyAppVersion=$ver" /DMachineInstall=1 '/DOutputSuffix="-machine"' installer\windows\TextVN-setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\win\validate-store-package.ps1 -MachineOnly -Setup "dist\TextVN-setup-$ver-windows-x64-machine.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # MSIX la asset BAT BUOC cua moi release (0.2.17+): build ngay o day de
      # bat loi som moi commit thay vi doi den luc tag (release.yml cung build).
      - name: Build MSIX (bat buoc cho release)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\win\build-msix.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # R2-09: makeappx chi kiem XSD — luat Partner Center (Version phan dau != 0,
      # Publisher/DisplayName, encoding mo ta, kich thuoc anh, payload) kiem o day.
      - name: Verify MSIX (luat Store + payload)
        shell: bash
        run: |
          ver="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          cargo run -q -p xtask -- verify-msix dist/TextVN-*-windows-x64.msix --expect-version "$ver"
      # R2-02/R2-04: kenh Store chay THAT tren Windows — cai goi da ky tam, mo app,
      # kiem tu shell ngoai goi (stage that, TIP HKCU, tray ngoai container, Run),
      # go goi roi --msix-guard phai don sach.
      - name: MSIX sideload (cai that, mo app, go goi)
        shell: powershell
        run: |
          $msix = Get-ChildItem dist\TextVN-*-windows-x64.msix | Select-Object -First 1
          powershell -NoProfile -ExecutionPolicy Bypass -File installer\windows\tests\test-msix-sideload.ps1 -Msix $msix.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: textvn-windows-x64-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.msix
            dist/SHA256SUMS-*.txt
          if-no-files-found: warn
