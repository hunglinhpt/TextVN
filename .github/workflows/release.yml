# SPDX-License-Identifier: GPL-3.0-or-later
# Mỗi tag tạo một release candidate bất biến; mọi asset được ký GPG (.asc) + Sigstore
# keyless, SHA256SUMS.txt được clearsign (tools/release/sign-artifacts.sh,
# docs/release/signing.md). Còn thiếu: Authenticode (Windows — chờ SignPath duyệt) và
# Developer ID + notarization (macOS — docs/release/signing-status-mac.md).
name: release-candidate

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      # Ky SignPath (goi Open Source cua SignPath Foundation) - bat khi secrets
      # duoc cau hinh; khong co thi build nhu cu (release-candidate chua ky).
      # Huong dan apply + quy trinh: docs/release/code-signing-plan.md
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_KEY: ${{ secrets.SIGNPATH_PROJECT_KEY }}
      SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_ARTIFACT_CONFIGURATION: ${{ secrets.SIGNPATH_ARTIFACT_CONFIGURATION }}
      SIGNPATH_POLICY: ${{ secrets.SIGNPATH_POLICY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,i686-pc-windows-msvc
          components: rustfmt, clippy
      - name: Install Inno Setup
        shell: powershell
        run: |
          choco upgrade innosetup --no-progress -y | Out-Null
          $dir = "${env:ProgramFiles(x86)}\Inno Setup 6"
          if (-not (Test-Path "$dir\ISCC.exe")) { throw 'ISCC.exe missing' }
          $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build and test Windows candidate
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File build-release.ps1 -BuildInstaller
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zip = Get-ChildItem dist\TextVN-portable-*.zip | Select-Object -First 1
          powershell -NoProfile -ExecutionPolicy Bypass -File installer\windows\tests\test-portable.ps1 -Zip $zip.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = Get-ChildItem dist\TextVN-setup-*.exe | Select-Object -First 1
          powershell -NoProfile -ExecutionPolicy Bypass -File installer\windows\tests\test-installer.ps1 -Setup $setup.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Gate BAT BUOC (Checklist S): 3 buoc manual package validation cua
      # Microsoft tren runner sach - silent/ARP/bundleware + silent uninstall.
      - name: Store package validation (MS manual checks, bat buoc)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\win\validate-store-package.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # MSIX (yeu cau chu repo 2026-10-03: MOI release phai kem ban msix).
      # Runtime full-trust, xem installer/windows/msix. Loi = fail job (khong
      # best-effort nua) va publish job con validate du 1 file .msix.
      # Identity that tu Partner Center (Product identity > Package/Identity/Name) dat
      # o repo variable MSIX_IDENTITY_NAME (khong phai secret). Co bien -> goi nop
      # Store, placeholder = fail cung; chua co -> goi test (canh bao to).
      - name: Build MSIX (required)
        shell: powershell
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_DISPLAY_NAME: ${{ vars.MSIX_DISPLAY_NAME }}
        run: |
          if ($env:MSIX_IDENTITY_NAME) {
            powershell -NoProfile -ExecutionPolicy Bypass -File tools\win\build-msix.ps1 -RequireStoreIdentity
          } else {
            powershell -NoProfile -ExecutionPolicy Bypass -File tools\win\build-msix.ps1
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify MSIX (luat Store + payload)
        shell: bash
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_DISPLAY_NAME: ${{ vars.MSIX_DISPLAY_NAME }}
        run: |
          ver="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          extra=()
          if [ -n "${MSIX_IDENTITY_NAME:-}" ]; then extra+=(--require-store-identity); fi
          python tools/win/verify-msix.py dist/TextVN-*-windows-x64.msix --expect-version "$ver" "${extra[@]}"
      # R2-77: CHINH goi sap phat hanh phai chay that (cai ky tam, mo app, go goi)
      # - khong chi dua vao lan ci-shared truoc do.
      - name: MSIX sideload (cai that, mo app, go goi)
        shell: powershell
        run: |
          $msix = Get-ChildItem dist\TextVN-*-windows-x64.msix | Select-Object -First 1
          powershell -NoProfile -ExecutionPolicy Bypass -File installer\windows\tests\test-msix-sideload.ps1 -Msix $msix.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Bien the MAY (PrivilegesRequired=admin, ARP o HKLM) — goi danh cho
      # Package validation cua Store (vong 5: validator khong thay entry HKCU).
      # Chay SAU moi test per-user de khong lam lech auto-pick; tu validate
      # -MachineOnly tren runner elevated (PASS 0-4) truoc khi dong goi.
      - name: Build + validate machine installer (ARP o HKLM, cho Store)
        shell: powershell
        env:
          STORE_APP_NAME: ${{ vars.STORE_APP_NAME }}
          STORE_PUBLISHER_NAME: ${{ vars.STORE_PUBLISHER_NAME }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command iscc.exe -ErrorAction Stop).Source }
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          & $iscc "/DMyAppVersion=$ver" /DMachineInstall=1 '/DOutputSuffix="-machine"' installer\windows\TextVN-setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = "dist\TextVN-setup-$ver-windows-x64-machine.exe"
          if (-not (Test-Path $exe)) { throw "machine installer not found: $exe" }
          # R2-17: ban -machine.exe la ban NOP STORE — ky Authenticode nhu ban per-user
          # (SignPath; khong co secret thi giu release-candidate chua ky).
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\win\sign-signpath.ps1 -File $exe -Description "TextVN installer (machine)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\win\validate-store-package.ps1 -MachineOnly -Setup $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # VirusTotal scan: kiem tra AV bao nham truoc khi publish (best-effort,
      # khong chan release neu VT quota het). Secret: VIRUSTOTAL_API_KEY.
      - name: VirusTotal scan (AV false positive check)
        shell: powershell
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          if (-not $env:VIRUSTOTAL_API_KEY) { Write-Host 'SKIP: VIRUSTOTAL_API_KEY not set'; exit 0 }
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\win\virustotal-scan.ps1 -Files "dist\TextVN-setup-*.exe,dist\TextVN-portable-*.zip,dist\TextVN-*.msix" -Upload -MaxDetections 5
          if ($LASTEXITCODE -ne 0) { Write-Host 'WARN: VT detections vuot nguong - kiem tra ket qua truoc khi publish' }
          # Best-effort: khong bao gio chan release (GH Actions exit theo
          # LASTEXITCODE cua command cuoi -> phai exit 0 tuong minh; release
          # v0.2.20 tung do o buoc nay du chi la WARN).
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/TextVN-portable-*.zip
            dist/TextVN-setup-*.exe
            dist/TextVN-*.msix
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install adapter dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake pkg-config \
            libibus-1.0-dev libfcitx5core-dev libfcitx5utils-dev fcitx5-modules-dev \
            libgtk-4-dev ibus fcitx5 fcitx5-modules dbus python3-dbus python3-gi
      - name: Build and test Linux candidate
        run: |
          cargo run -q -p xtask -- check-version-sync
          scripts/e2e-linux.sh
          scripts/build-linux.sh --skip-tests
          scripts/test-linux-package.sh dist/TextVN-*-linux-*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/TextVN-*-linux-*.tar.gz
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      # THỨ TỰ BẮT BUỘC: build-macos.sh dựng staticlib vào adapters/macos-imk/lib
      # trước — swift test của macos-app link libtextvn_ffi từ đó (đảo thứ tự từng
      # làm release run fail: "library 'textvn_ffi' not found"). swift test vẫn
      # chạy TRƯỚC package-macos-pkg.sh để fail test thì đừng đốt thời gian gói.
      - name: Build macOS candidate (staticlib + bundles)
        run: scripts/build-macos.sh
      - name: Test Swift packages (arm64)
        run: |
          for package in adapters/macos-imk adapters/macos-tap adapters/macos-app; do
            (cd "$package" && swift test --arch arm64)
          done
      - name: Package pkg installer
        run: scripts/package-macos-pkg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            dist/macos/*.zip
            dist/macos/*.tar.gz
            dist/macos/*.pkg
          if-no-files-found: error

  publish:
    needs: [windows, linux, macos]
    # workflow_dispatch tren nhanh = chay thu build (lay artifact), khong phat hanh.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Install cosign (Sigstore)
        uses: sigstore/cosign-installer@v3
      - name: Validate tag, payload, checksums and publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          COSIGN_YES: 'true'
        run: |
          set -euo pipefail
          version="$(sed -n '/^\[workspace.package\]$/,/^\[/ s/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "FATAL: tag ${GITHUB_REF_NAME} != version trong Cargo.toml (${version}) — phải bump version (14 chỗ) rồi mới tag. Sự cố R4: docs/release/release-process.md" >&2
            exit 1
          fi
          test "$(find release-assets -maxdepth 1 -type f -name 'TextVN-portable-*.zip' | wc -l)" -eq 1
          # Per-user (mac dinh) + machine (Store bien the HKLM) = dung 2 exe.
          test "$(find release-assets -maxdepth 1 -type f -name 'TextVN-setup-*.exe' ! -name '*-machine.exe' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name 'TextVN-setup-*-machine.exe' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name 'TextVN-*-linux-*.tar.gz' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name '*.pkg' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name '*.zip' | wc -l)" -ge 2
          # MSIX la asset BAT BUOC tu 0.2.17 (yeu cau chu repo: moi release kem msix)
          test "$(find release-assets -maxdepth 1 -type f -name '*.msix' | wc -l)" -eq 1
          portable="$(find release-assets -maxdepth 1 -type f -name 'TextVN-portable-*.zip' -print -quit)"
          unzip -p "$portable" RELEASE_REPORT.json | jq -e \
            --arg version "$version" --arg commit "$GITHUB_SHA" \
            '.product == "TextVN" and .version == $version and .git_commit == $commit and .source_tree_clean == true and .status == "release-candidate" and .feature_profile == "tsf-only"'
          if unzip -Z1 "$portable" | grep -qi 'textvn-hook.exe'; then
            echo 'Default release must not contain the compatibility hook.' >&2
            exit 1
          fi
          # Draft-first: tạo release dạng draft, upload hết asset rồi mới public.
          # Upload asset fail giữa chừng (mạng/quota) trước đây để lại release
          # public thiếu asset và guard dưới đây khoá luôn việc chạy lại — draft
          # thì fail vô hại và chạy lại được (upload idempotent với --clobber).
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            draft="$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq '.isDraft')"
            if [ "$draft" != "true" ]; then
              echo 'Release exists and is published; refusing to overwrite immutable assets.' >&2
              exit 1
            fi
            # R2-78: chạy lại tag → draft còn asset của lần build trước (tên ZIP có
            # build-id khác) và --clobber không xoá chúng → phát hành lẫn hai bản.
            gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' |
              while IFS= read -r old; do
                [ -n "$old" ] && gh release delete-asset "${GITHUB_REF_NAME}" "$old" --yes
              done
          else
            gh release create "${GITHUB_REF_NAME}" --draft --verify-tag --prerelease \
              --title "TextVN ${version} (release candidate)" \
              --notes "Bản release candidate do workflow này build và test từ ${GITHUB_SHA}. Mọi file đều có chữ ký GPG tách rời (.asc — khoá FPR 3921595ABC961199F15303B6C45B84D0C7F4A822, public key gpg-release-key.asc đính kèm) và chữ ký Sigstore keyless (.cosign.sig + .cosign.cert); SHA256SUMS.txt được clearsign. Cách kiểm: docs/release/signing.md. Thay đổi: CHANGELOG.md. ZIP Windows chứa RELEASE_REPORT.json. Chưa có: Authenticode cho Windows (đang chờ SignPath Foundation duyệt — SmartScreen có thể cảnh báo) và Developer ID + notarization cho macOS (Gatekeeper cảnh báo lần mở đầu). File .msix chưa ký, chỉ dùng để nộp Microsoft Store — không cài trực tiếp được."
          fi
          cp docs/release/signing/gpg-release-key.asc release-assets/
          (cd release-assets && sha256sum * > SHA256SUMS.txt)
          # Homebrew cask (bước B7b): sha256 của zip macOS chỉ biết sau build — nhắc
          # đúng dòng cần commit thay vì để cask lệch nhiều bản (R2-76).
          mac_zip="$(cd release-assets && ls TextVN-macos-universal-v*.zip 2>/dev/null | head -1)"
          if [ -n "$mac_zip" ]; then
            want="$(cd release-assets && sha256sum "$mac_zip" | cut -d' ' -f1)"
            have="$(sed -n 's/^  sha256 "\([0-9a-f]*\)"/\1/p' packaging/homebrew/textvn.rb)"
            if [ "$want" != "$have" ]; then
              echo "::warning title=Homebrew cask::packaging/homebrew/textvn.rb cần sha256 \"$want\" cho $mac_zip (bước B7b release-process)"
            fi
          fi
          chmod +x tools/release/sign-artifacts.sh
          bash tools/release/sign-artifacts.sh release-assets
          gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
          gh release edit "${GITHUB_REF_NAME}" --draft=false
