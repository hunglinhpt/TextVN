# SPDX-License-Identifier: GPL-3.0-or-later
# Mỗi tag tạo một release candidate bất biến; mọi asset được ký GPG (.asc) + Sigstore
# keyless, SHA256SUMS.txt được clearsign (tools/release/sign-artifacts.sh,
# docs/release/signing.md). Còn thiếu: Authenticode (Windows — chờ SignPath duyệt) và
# Developer ID + notarization (macOS — docs/release/signing-status-mac.md).
name: release-candidate

on:
  push:
    tags: ["v[0-9]*"]
  # Chạy tay = chỉ build (artifact), KHÔNG phát hành — kể cả khi chọn ref là tag. Dùng để
  # build lại gói MSIX nộp Store với identity từ Partner Center mà không đụng release đã
  # công khai (docs/release/msix-submission.md §3).
  workflow_dispatch:
    inputs:
      msix_identity_name:
        description: "Package/Identity/Name từ Partner Center (trống = repo variable MSIX_IDENTITY_NAME)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      # Ky SignPath (goi Open Source cua SignPath Foundation) - bat khi secrets
      # duoc cau hinh; khong co thi build nhu cu (release-candidate chua ky).
      # Huong dan apply + quy trinh: docs/release/code-signing-plan.md
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_KEY: ${{ secrets.SIGNPATH_PROJECT_KEY }}
      SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_ARTIFACT_CONFIGURATION: ${{ secrets.SIGNPATH_ARTIFACT_CONFIGURATION }}
      SIGNPATH_POLICY: ${{ secrets.SIGNPATH_POLICY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: x86_64-pc-windows-msvc,i686-pc-windows-msvc
          components: rustfmt, clippy
      - name: Install Inno Setup
        shell: powershell
        run: |
          choco upgrade innosetup --no-progress -y | Out-Null
          $dir = "${env:ProgramFiles(x86)}\Inno Setup 6"
          if (-not (Test-Path "$dir\ISCC.exe")) { throw 'ISCC.exe missing' }
          $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build and test Windows candidate
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File build-release.ps1 -BuildInstaller
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zip = Get-ChildItem dist\TextVN-portable-*.zip | Select-Object -First 1
          powershell -NoProfile -ExecutionPolicy Bypass -File installer\windows\tests\test-portable.ps1 -Zip $zip.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = Get-ChildItem dist\TextVN-setup-*.exe | Select-Object -First 1
          powershell -NoProfile -ExecutionPolicy Bypass -File installer\windows\tests\test-installer.ps1 -Setup $setup.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Gate BAT BUOC (Checklist S): 3 buoc manual package validation cua
      # Microsoft tren runner sach - silent/ARP/bundleware + silent uninstall.
      - name: Store package validation (MS manual checks, bat buoc)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\win\validate-store-package.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # MSIX (yeu cau chu repo 2026-10-03: MOI release phai kem ban msix).
      # Runtime full-trust, xem installer/windows/msix. Loi = fail job (khong
      # best-effort nua) va publish job con validate du 1 file .msix.
      # Identity that tu Partner Center (Product identity > Package/Identity/Name) dat
      # o repo variable MSIX_IDENTITY_NAME (khong phai secret) hoac o input
      # msix_identity_name khi chay tay. Co -> goi nop Store, placeholder = fail cung;
      # chua co -> goi test (canh bao to).
      - name: Build MSIX (required)
        shell: powershell
        env:
          MSIX_IDENTITY_NAME: ${{ inputs.msix_identity_name || vars.MSIX_IDENTITY_NAME }}
          MSIX_DISPLAY_NAME: ${{ vars.MSIX_DISPLAY_NAME }}
        run: |
          if ($env:MSIX_IDENTITY_NAME) {
            powershell -NoProfile -ExecutionPolicy Bypass -File tools\win\build-msix.ps1 -RequireStoreIdentity
          } else {
            powershell -NoProfile -ExecutionPolicy Bypass -File tools\win\build-msix.ps1
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify MSIX (luat Store + payload)
        shell: bash
        env:
          MSIX_IDENTITY_NAME: ${{ inputs.msix_identity_name || vars.MSIX_IDENTITY_NAME }}
          MSIX_DISPLAY_NAME: ${{ vars.MSIX_DISPLAY_NAME }}
        run: |
          ver="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          extra=()
          if [ -n "${MSIX_IDENTITY_NAME:-}" ]; then extra+=(--require-store-identity); fi
          cargo run -q -p xtask -- verify-msix dist/TextVN-*-windows-x64.msix --expect-version "$ver" "${extra[@]}"
      # R2-77: CHINH goi sap phat hanh phai chay that (cai ky tam, mo app, go goi)
      # - khong chi dua vao lan ci-shared truoc do.
      - name: MSIX sideload (cai that, mo app, go goi)
        shell: powershell
        run: |
          $msix = Get-ChildItem dist\TextVN-*-windows-x64.msix | Select-Object -First 1
          powershell -NoProfile -ExecutionPolicy Bypass -File installer\windows\tests\test-msix-sideload.ps1 -Msix $msix.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Bien the MAY (PrivilegesRequired=admin, ARP o HKLM) — goi danh cho
      # Package validation cua Store (vong 5: validator khong thay entry HKCU).
      # Chay SAU moi test per-user de khong lam lech auto-pick; tu validate
      # -MachineOnly tren runner elevated (PASS 0-4) truoc khi dong goi.
      - name: Build + validate machine installer (ARP o HKLM, cho Store)
        shell: powershell
        env:
          STORE_APP_NAME: ${{ vars.STORE_APP_NAME }}
          STORE_PUBLISHER_NAME: ${{ vars.STORE_PUBLISHER_NAME }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command iscc.exe -ErrorAction Stop).Source }
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          & $iscc "/DMyAppVersion=$ver" /DMachineInstall=1 '/DOutputSuffix="-machine"' installer\windows\TextVN-setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = "dist\TextVN-setup-$ver-windows-x64-machine.exe"
          if (-not (Test-Path $exe)) { throw "machine installer not found: $exe" }
          # R2-17: ban -machine.exe la ban NOP STORE — ky Authenticode nhu ban per-user
          # (SignPath; khong co secret thi giu release-candidate chua ky).
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\win\sign-signpath.ps1 -File $exe -Description "TextVN installer (machine)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\win\validate-store-package.ps1 -MachineOnly -Setup $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # VirusTotal scan: kiem tra AV bao nham truoc khi publish (best-effort,
      # khong chan release neu VT quota het). Secret: VIRUSTOTAL_API_KEY.
      - name: VirusTotal scan (AV false positive check)
        shell: powershell
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          if (-not $env:VIRUSTOTAL_API_KEY) { Write-Host 'SKIP: VIRUSTOTAL_API_KEY not set'; exit 0 }
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\win\virustotal-scan.ps1 -Files "dist\TextVN-setup-*.exe,dist\TextVN-portable-*.zip,dist\TextVN-*.msix" -Upload -MaxDetections 5
          if ($LASTEXITCODE -ne 0) { Write-Host 'WARN: VT detections vuot nguong - kiem tra ket qua truoc khi publish' }
          # Best-effort: khong bao gio chan release (GH Actions exit theo
          # LASTEXITCODE cua command cuoi -> phai exit 0 tuong minh; release
          # v0.2.20 tung do o buoc nay du chi la WARN).
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/TextVN-portable-*.zip
            dist/TextVN-setup-*.exe
            dist/TextVN-*.msix
          if-no-files-found: error

  # ARM-W7 (ADR-015: mac dinh tach goi x64/arm64 khi phat hanh) — build setup +
  # portable arm64 tren runner ARM64 that; tiep cho linux-arm64 o phia Linux.
  windows-arm64:
    name: Windows arm64 (setup + portable)
    runs-on: windows-11-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Runner must be ARM64
        shell: powershell
        run: |
          Write-Output "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          if ($env:PROCESSOR_ARCHITECTURE -ne 'ARM64') { throw 'runner is not ARM64' }
      - name: Rust stable with a NATIVE aarch64-pc-windows-msvc host
        shell: powershell
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $init = Join-Path $env:RUNNER_TEMP 'rustup-init.exe'
            Invoke-WebRequest -UseBasicParsing 'https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe' -OutFile $init
            & $init -y --profile minimal --default-toolchain stable --default-host aarch64-pc-windows-msvc
            if ($LASTEXITCODE -ne 0) { throw "rustup-init failed: $LASTEXITCODE" }
            Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:USERPROFILE '.cargo\bin')
          } else {
            rustup set default-host aarch64-pc-windows-msvc
            rustup toolchain install stable --profile minimal
            rustup default stable
          }
          rustup component add rustfmt clippy
          rustup target add x86_64-pc-windows-msvc i686-pc-windows-msvc
      - name: rustc host must be aarch64-pc-windows-msvc (no emulated x64 toolchain)
        shell: powershell
        run: |
          $vv = rustc -vV
          $vv | Write-Output
          if (-not ($vv -match 'host: aarch64-pc-windows-msvc')) { throw 'rustc host is not aarch64-pc-windows-msvc' }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-win-arm64-v1
      - name: Inno Setup 6
        shell: powershell
        run: |
          $dir86 = "${env:ProgramFiles(x86)}\Inno Setup 6"
          $dir64 = "${env:ProgramFiles}\Inno Setup 6"
          if (-not (Test-Path "$dir86\ISCC.exe") -and -not (Test-Path "$dir64\ISCC.exe")) {
            choco upgrade innosetup --no-progress -y | Out-Null
          }
          if (Test-Path "$dir86\ISCC.exe") {
            $dir86 | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } elseif (Test-Path "$dir64\ISCC.exe") {
            $dir64 | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            throw 'ISCC.exe not found after Inno Setup 6 install'
          }
      - name: build-release.ps1 -Arch arm64 -SkipTests -BuildInstaller
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File build-release.ps1 -Arch arm64 -SkipTests -BuildInstaller
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # ARM-W6: goi MSIX arm64 (cung identity voi x64) - gop thanh .msixbundle o job windows-msixbundle.
      - name: Build MSIX arm64 (ARM-W6)
        shell: powershell
        env:
          MSIX_IDENTITY_NAME: ${{ inputs.msix_identity_name || vars.MSIX_IDENTITY_NAME }}
          MSIX_DISPLAY_NAME: ${{ vars.MSIX_DISPLAY_NAME }}
        run: |
          if ($env:MSIX_IDENTITY_NAME) {
            powershell -NoProfile -ExecutionPolicy Bypass -File tools\win\build-msix.ps1 -Arch arm64 -RequireStoreIdentity
          } else {
            powershell -NoProfile -ExecutionPolicy Bypass -File tools\win\build-msix.ps1 -Arch arm64
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify MSIX arm64 (luat Store + payload + Machine ARM64)
        shell: powershell
        env:
          MSIX_IDENTITY_NAME: ${{ inputs.msix_identity_name || vars.MSIX_IDENTITY_NAME }}
          MSIX_DISPLAY_NAME: ${{ vars.MSIX_DISPLAY_NAME }}
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $pkg = "dist\TextVN-$ver-windows-arm64.msix"
          $extra = @()
          if ($env:MSIX_IDENTITY_NAME) { $extra += '--require-store-identity' }
          cargo run -q -p xtask -- verify-msix $pkg --expect-version $ver @extra
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-arm64
          path: |
            dist/TextVN-portable-*-windows-arm64-*.zip
            dist/TextVN-setup-*-windows-arm64.exe
            dist/TextVN-*-windows-arm64.msix
          if-no-files-found: error

  # ARM-W6: MOT .msixbundle (x64 + arm64, cung identity/version) - Store chon dung goi theo may.
  windows-msixbundle:
    name: Windows .msixbundle (x64 + arm64)
    needs: [windows, windows-arm64]
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-windows-arm64
          path: dist
      - name: Bundle x64 + arm64 (makeappx bundle)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\win\build-msix.ps1 -Bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify .msixbundle (2 goi, cung identity, tung goi dat luat Store)
        shell: bash
        env:
          MSIX_IDENTITY_NAME: ${{ inputs.msix_identity_name || vars.MSIX_IDENTITY_NAME }}
          MSIX_DISPLAY_NAME: ${{ vars.MSIX_DISPLAY_NAME }}
        run: |
          ver="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          extra=()
          if [ -n "${MSIX_IDENTITY_NAME:-}" ]; then extra+=(--require-store-identity); fi
          cargo run -q -p xtask -- verify-msix "dist/TextVN-${ver}-windows.msixbundle" --expect-version "$ver" "${extra[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-msixbundle
          path: dist/TextVN-*-windows.msixbundle
          if-no-files-found: error

  # COMPAT-1: kiem E2E goi phat hanh tren windows-2025 song song windows-2022.
  windows-2025-e2e:
    name: Windows E2E (windows-2025)
    needs: windows
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      STORE_APP_NAME: ${{ vars.STORE_APP_NAME }}
      STORE_PUBLISHER_NAME: ${{ vars.STORE_PUBLISHER_NAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: dist
      - name: Portable ZIP E2E (windows-2025)
        shell: powershell
        run: |
          $zip = Get-ChildItem dist\TextVN-portable-*-windows-x64-*.zip | Select-Object -First 1
          if (-not $zip) { throw 'portable zip missing' }
          powershell -NoProfile -ExecutionPolicy Bypass -File installer\windows\tests\test-portable.ps1 -Zip $zip.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Installer E2E (windows-2025)
        shell: powershell
        run: |
          $setup = Get-ChildItem dist\TextVN-setup-*-windows-x64.exe | Where-Object { $_.Name -notlike '*-machine.exe' } | Select-Object -First 1
          if (-not $setup) { throw 'installer exe missing' }
          powershell -NoProfile -ExecutionPolicy Bypass -File installer\windows\tests\test-installer.ps1 -Setup $setup.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # COMPAT-1 review: đường HKLM là chỗ dễ khác nhau giữa Server 2022/2025 —
      # biến thể -machine.exe (ARP ở HKLM) phải được kiểm cả trên windows-2025,
      # cùng giai đoạn lấy bằng chứng như job windows (continue-on-error cho tới
      # khi 2 run xanh liên tiếp rồi đổi thành gate cứng).
      - name: Machine installer E2E (ARP ở HKLM, windows-2025)
        shell: powershell
        continue-on-error: true
        timeout-minutes: 15
        run: |
          $setup = Get-ChildItem dist\TextVN-setup-*-windows-x64-machine.exe | Select-Object -First 1
          if (-not $setup) { throw 'machine installer exe missing' }
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\win\validate-store-package.ps1 -MachineOnly -Setup $setup.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Simulate Store validator (windows-2025)
        shell: powershell
        timeout-minutes: 15
        run: |
          $setup = Get-ChildItem dist\TextVN-setup-*-windows-x64.exe | Where-Object { $_.Name -notlike '*-machine.exe' } | Select-Object -First 1
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\win\simulate-store-validation.ps1 -Setup $setup.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: MSIX sideload E2E (windows-2025)
        shell: powershell
        run: |
          $msix = Get-ChildItem dist\TextVN-*-windows-x64.msix | Select-Object -First 1
          if (-not $msix) { throw 'msix package missing' }
          powershell -NoProfile -ExecutionPolicy Bypass -File installer\windows\tests\test-msix-sideload.ps1 -Msix $msix.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - name: Install adapter dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake pkg-config \
            libibus-1.0-dev libfcitx5core-dev libfcitx5utils-dev fcitx5-modules-dev \
            libgtk-4-dev ibus fcitx5 fcitx5-modules dbus libdbus-1-dev
      - name: Build and test host adapters (Ubuntu 24.04)
        run: |
          cargo run -q -p xtask -- check-version-sync
          scripts/e2e-linux.sh
      - name: Build EL8 baseline (RHEL 8.10 glibc 2.28 + GTK3)
        run: |
          cargo fetch --locked
          RUSTUP_DIR="$(rustup show home)"
          CARGO_DIR="${CARGO_HOME:-$HOME/.cargo}"
          HOST_UID="$(id -u)"
          HOST_GID="$(id -g)"
          docker run --rm \
            -v "$PWD:/src" \
            -v "$RUSTUP_DIR:/rustup:ro" \
            -v "$CARGO_DIR:/cargo" \
            -e HOST_UID="$HOST_UID" \
            -e HOST_GID="$HOST_GID" \
            almalinux:8 bash -euo pipefail -c '
              dnf --enablerepo=powertools install -y --setopt=install_weak_deps=False \
                gcc make cmake pkgconf-pkg-config ibus-devel gtk3-devel ibus dbus-daemon dbus-tools procps-ng gawk dconf xkeyboard-config >/dev/null
              groupadd -f -g "$HOST_GID" builder || true
              useradd -m -u "$HOST_UID" -g "$HOST_GID" -o builder
              mkdir -p /tmp/target-el8 && chown -R "$HOST_UID:$HOST_GID" /tmp/target-el8
              su -s /bin/bash builder -c "
                export PATH=/cargo/bin:\$PATH
                export RUSTUP_HOME=/rustup CARGO_HOME=/cargo CARGO_TARGET_DIR=/tmp/target-el8
                export LC_ALL=C.UTF-8 LANG=C.UTF-8
                bash /src/scripts/build-linux-el8.sh /src/target/linux-el8
              "
            '
      - name: Build compat baseline (Ubuntu 22.04 glibc 2.35 + GTK4 + Fcitx5)
        run: |
          RUSTUP_DIR="$(rustup show home)"
          CARGO_DIR="${CARGO_HOME:-$HOME/.cargo}"
          HOST_UID="$(id -u)"
          HOST_GID="$(id -g)"
          docker run --rm \
            -v "$PWD:/src" \
            -v "$RUSTUP_DIR:/rustup:ro" \
            -v "$CARGO_DIR:/cargo" \
            -e HOST_UID="$HOST_UID" \
            -e HOST_GID="$HOST_GID" \
            ubuntu:22.04 bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends \
                build-essential cmake pkg-config libgtk-4-dev \
                libfcitx5core-dev libfcitx5utils-dev fcitx5-modules-dev libdbus-1-dev >/dev/null
              groupadd -f -g "$HOST_GID" builder || true
              useradd -m -u "$HOST_UID" -g "$HOST_GID" -o builder
              mkdir -p /tmp/target-compat && chown -R "$HOST_UID:$HOST_GID" /tmp/target-compat
              su -s /bin/bash builder -c "
                export PATH=/cargo/bin:\$PATH
                export RUSTUP_HOME=/rustup CARGO_HOME=/cargo CARGO_TARGET_DIR=/tmp/target-compat
                export LC_ALL=C.UTF-8 LANG=C.UTF-8
                bash /src/scripts/build-linux-compat.sh /src/target/linux-compat
              "
            '
      - name: Package and test Linux candidate (Ubuntu 24.04)
        run: |
          scripts/build-linux.sh --skip-tests --el8-dir target/linux-el8 --compat-dir target/linux-compat
          scripts/test-linux-package.sh dist/TextVN-*-linux-*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/TextVN-*-linux-*.tar.gz
          if-no-files-found: error
      - run: |
          mkdir -p target/e2e-helpers
          cp -f target/linux-el8/ibus/e2e_ibus target/e2e-helpers/e2e_ibus
          cp -f target/linux-compat/fcitx5/e2e_fcitx5 target/e2e-helpers/e2e_fcitx5
      - uses: actions/upload-artifact@v4
        with:
          name: linux-e2e-helpers
          path: target/e2e-helpers/*
          if-no-files-found: error

  linux-arm64:
    name: Linux aarch64 (Ubuntu 24.04 ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Kiến trúc runner phải là aarch64
        run: |
          uname -m
          test "$(uname -m)" = aarch64
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - name: Install adapter dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake pkg-config \
            libibus-1.0-dev libfcitx5core-dev libfcitx5utils-dev fcitx5-modules-dev \
            libgtk-4-dev ibus fcitx5 fcitx5-modules dbus libdbus-1-dev file
      - name: Build and test host adapters (Ubuntu 24.04 ARM64)
        run: |
          cargo run -q -p xtask -- check-version-sync
          scripts/e2e-linux.sh
      - name: Build EL8 baseline (RHEL 8.10 glibc 2.28 + GTK3, aarch64)
        run: |
          cargo fetch --locked
          RUSTUP_DIR="$(rustup show home)"
          CARGO_DIR="${CARGO_HOME:-$HOME/.cargo}"
          HOST_UID="$(id -u)"
          HOST_GID="$(id -g)"
          docker run --rm \
            -v "$PWD:/src" \
            -v "$RUSTUP_DIR:/rustup:ro" \
            -v "$CARGO_DIR:/cargo" \
            -e HOST_UID="$HOST_UID" \
            -e HOST_GID="$HOST_GID" \
            almalinux:8 bash -euo pipefail -c '
              dnf --enablerepo=powertools install -y --setopt=install_weak_deps=False \
                gcc make cmake pkgconf-pkg-config ibus-devel gtk3-devel ibus dbus-daemon dbus-tools procps-ng gawk dconf xkeyboard-config >/dev/null
              groupadd -f -g "$HOST_GID" builder || true
              useradd -m -u "$HOST_UID" -g "$HOST_GID" -o builder
              mkdir -p /tmp/target-el8 && chown -R "$HOST_UID:$HOST_GID" /tmp/target-el8
              su -s /bin/bash builder -c "
                export PATH=/cargo/bin:\$PATH
                export RUSTUP_HOME=/rustup CARGO_HOME=/cargo CARGO_TARGET_DIR=/tmp/target-el8
                export LC_ALL=C.UTF-8 LANG=C.UTF-8
                bash /src/scripts/build-linux-el8.sh /src/target/linux-el8
              "
            '
      - name: Build compat baseline (Ubuntu 22.04 glibc 2.35 + GTK4 + Fcitx5, aarch64)
        run: |
          RUSTUP_DIR="$(rustup show home)"
          CARGO_DIR="${CARGO_HOME:-$HOME/.cargo}"
          HOST_UID="$(id -u)"
          HOST_GID="$(id -g)"
          docker run --rm \
            -v "$PWD:/src" \
            -v "$RUSTUP_DIR:/rustup:ro" \
            -v "$CARGO_DIR:/cargo" \
            -e HOST_UID="$HOST_UID" \
            -e HOST_GID="$HOST_GID" \
            ubuntu:22.04 bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends \
                build-essential cmake pkg-config libgtk-4-dev \
                libfcitx5core-dev libfcitx5utils-dev fcitx5-modules-dev libdbus-1-dev >/dev/null
              groupadd -f -g "$HOST_GID" builder || true
              useradd -m -u "$HOST_UID" -g "$HOST_GID" -o builder
              mkdir -p /tmp/target-compat && chown -R "$HOST_UID:$HOST_GID" /tmp/target-compat
              su -s /bin/bash builder -c "
                export PATH=/cargo/bin:\$PATH
                export RUSTUP_HOME=/rustup CARGO_HOME=/cargo CARGO_TARGET_DIR=/tmp/target-compat
                export LC_ALL=C.UTF-8 LANG=C.UTF-8
                bash /src/scripts/build-linux-compat.sh /src/target/linux-compat
              "
            '
      - name: Package and test Linux aarch64 candidate
        run: |
          scripts/build-linux.sh --skip-tests --el8-dir target/linux-el8 --compat-dir target/linux-compat
          ls -la dist/TextVN-*-linux-aarch64.tar.gz
          file target/linux-el8/bin/textvn-cli | grep -q 'ARM aarch64'
          scripts/test-linux-package.sh dist/TextVN-*-linux-aarch64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-arm64
          path: dist/TextVN-*-linux-aarch64.tar.gz
          if-no-files-found: error
      - run: |
          mkdir -p target/e2e-helpers
          cp -f target/linux-el8/ibus/e2e_ibus target/e2e-helpers/e2e_ibus
          cp -f target/linux-compat/fcitx5/e2e_fcitx5 target/e2e-helpers/e2e_fcitx5
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-e2e-helpers
          path: target/e2e-helpers/*
          if-no-files-found: error

  linux-distro-matrix:
    name: Linux E2E (${{ matrix.label }})
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: almalinux-8
            label: RHEL 8.10 / AlmaLinux 8
            image: almalinux:8
            mode: el8
          - tag: almalinux-9
            label: RHEL 9 / AlmaLinux 9
            image: almalinux:9
            mode: matrix
          - tag: opensuse-leap-15-6
            label: SLES 15 / openSUSE Leap 15.6
            image: opensuse/leap:15.6
            mode: matrix
          - tag: ubuntu-22-04
            label: Ubuntu 22.04 LTS / Mint 21
            image: ubuntu:22.04
            mode: matrix
          - tag: debian-12
            label: Debian 12 Bookworm
            image: debian:12
            mode: matrix
          - tag: fedora-41
            label: Fedora 41 / RHEL 10 upstream
            image: fedora:41
            mode: matrix
          - tag: ubuntu-24-04
            label: Ubuntu 24.04 LTS
            image: ubuntu:24.04
            mode: matrix
          - tag: ubuntu-26-04
            label: Ubuntu 26.04 LTS
            image: ubuntu:26.04
            mode: matrix
          - tag: debian-13
            label: Debian 13 Trixie
            image: debian:13
            mode: matrix
          - tag: fedora-42
            label: Fedora 42
            image: fedora:42
            mode: matrix
          - tag: fedora-43
            label: Fedora 43
            image: fedora:43
            mode: matrix
          - tag: opensuse-tumbleweed
            label: openSUSE Tumbleweed
            image: opensuse/tumbleweed
            mode: matrix
          - tag: almalinux-10
            label: RHEL 10 / AlmaLinux 10
            image: almalinux:10
            mode: matrix
          - tag: mint-22
            label: Linux Mint 22 (Ubuntu 24.04 base)
            image: linuxmintd/mint22-amd64
            mode: matrix
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: linux-e2e-helpers
          path: e2e-helpers
      - name: Run container E2E on ${{ matrix.label }}
        run: bash scripts/run-distro-container.sh "${{ matrix.image }}" "${{ matrix.tag }}" "${{ matrix.mode }}" "$(ls dist/TextVN-*-linux-*.tar.gz | head -n1)" e2e-helpers "-"

  # ARM-L4 + COMPAT-2: E2E 13 distro Linux trên container arm64 (gói TextVN-*-linux-aarch64.tar.gz;
  # Mint 22 chỉ có ảnh amd64 nên chỉ chạy ở ma trận x86_64).
  # G22: khối docker-run (deps/machine-id/user tester) là scripts/run-distro-container.sh
  # dùng chung với job x86_64 — chỉ khác runner, artifact và assert arch.
  linux-arm64-distro-matrix:
    name: Linux ARM64 E2E (${{ matrix.label }})
    needs: linux-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: almalinux-8
            label: RHEL 8.10 / AlmaLinux 8
            image: almalinux:8
            mode: el8
          - tag: almalinux-9
            label: RHEL 9 / AlmaLinux 9
            image: almalinux:9
            mode: matrix
          - tag: opensuse-leap-15-6
            label: SLES 15 / openSUSE Leap 15.6
            image: opensuse/leap:15.6
            mode: matrix
          - tag: ubuntu-22-04
            label: Ubuntu 22.04 LTS / Mint 21
            image: ubuntu:22.04
            mode: matrix
          - tag: debian-12
            label: Debian 12 Bookworm
            image: debian:12
            mode: matrix
          - tag: fedora-41
            label: Fedora 41 / RHEL 10 upstream
            image: fedora:41
            mode: matrix
          - tag: ubuntu-24-04
            label: Ubuntu 24.04 LTS
            image: ubuntu:24.04
            mode: matrix
          - tag: ubuntu-26-04
            label: Ubuntu 26.04 LTS
            image: ubuntu:26.04
            mode: matrix
          - tag: debian-13
            label: Debian 13 Trixie
            image: debian:13
            mode: matrix
          - tag: fedora-42
            label: Fedora 42
            image: fedora:42
            mode: matrix
          - tag: fedora-43
            label: Fedora 43
            image: fedora:43
            mode: matrix
          - tag: opensuse-tumbleweed
            label: openSUSE Tumbleweed
            image: opensuse/tumbleweed
            mode: matrix
          - tag: almalinux-10
            label: RHEL 10 / AlmaLinux 10
            image: almalinux:10
            mode: matrix
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Kiểm tra kiến trúc runner phải là aarch64
        run: test "$(uname -m)" = aarch64
      - uses: actions/download-artifact@v4
        with:
          name: release-linux-arm64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: linux-arm64-e2e-helpers
          path: e2e-helpers
      - name: Run container E2E on ${{ matrix.label }} (arm64)
        run: bash scripts/run-distro-container.sh "${{ matrix.image }}" "${{ matrix.tag }}" "${{ matrix.mode }}" "$(ls dist/TextVN-*-linux-aarch64.tar.gz | head -n1)" e2e-helpers aarch64

  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      # THỨ TỰ BẮT BUỘC: build-macos.sh dựng staticlib vào adapters/macos-imk/lib
      # trước — swift test của macos-app link libtextvn_ffi từ đó (đảo thứ tự từng
      # làm release run fail: "library 'textvn_ffi' not found"). swift test vẫn
      # chạy TRƯỚC package-macos-pkg.sh để fail test thì đừng đốt thời gian gói.
      - name: Build macOS candidate (staticlib + bundles)
        run: scripts/build-macos.sh
      - name: Test Swift packages (arm64)
        run: |
          for package in adapters/macos-imk adapters/macos-tap adapters/macos-app; do
            (cd "$package" && swift test --arch arm64)
          done
      - name: Package pkg installer
        run: scripts/package-macos-pkg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            dist/macos/*.zip
            dist/macos/*.tar.gz
            dist/macos/*.pkg
          if-no-files-found: error

  publish:
    needs: [windows, windows-arm64, windows-msixbundle, windows-2025-e2e, linux, linux-arm64, linux-distro-matrix, linux-arm64-distro-matrix, macos]
    # Chi push tag moi phat hanh. workflow_dispatch (tren nhanh HOAC tren tag, vd. build
    # lai MSIX voi identity Partner Center) = chi build artifact, khong dung release.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Install cosign (Sigstore)
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Validate tag, payload, checksums and publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          COSIGN_YES: 'true'
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          ALLOW_UNVERIFIED_GIT_SIGNATURE: ${{ vars.ALLOW_UNVERIFIED_GIT_SIGNATURE }}
        run: |
          set -euo pipefail
          version="$(sed -n '/^\[workspace.package\]$/,/^\[/ s/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "FATAL: tag ${GITHUB_REF_NAME} != version trong Cargo.toml (${version}) — phải bump version (14 chỗ) rồi mới tag. Sự cố R4: docs/release/release-process.md" >&2
            exit 1
          fi
          # Git signature gate (sự cố v0.2.30/0.2.31 mất huy hiệu "Verified"): commit được tag
          # VÀ tag object (annotated) phải được GitHub xác nhận. Cách đạt: ký SSH/GPG (key đăng ký
          # dạng "Signing Key") + 'git tag -s'. Xem docs/release/release-process.md (B5, R6).
          # Ngoại lệ có chủ đích: đặt repo variable ALLOW_UNVERIFIED_GIT_SIGNATURE=true.
          commit_v="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" --jq '.commit.verification | "\(.verified) \(.reason)"')"
          ref_type="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq '.object.type')"
          tag_v="lightweight"
          if [ "${ref_type}" = "tag" ]; then
            tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq '.object.sha')"
            tag_v="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.verification | "\(.verified) \(.reason)"')"
          fi
          echo "git signature: commit=[${commit_v}] tag=[${tag_v}]"
          if [ "${commit_v%% *}" != "true" ] || [ "${tag_v%% *}" != "true" ]; then
            if [ "${ALLOW_UNVERIFIED_GIT_SIGNATURE:-}" = "true" ]; then
              echo "::warning::Git signature chưa Verified (commit=[${commit_v}] tag=[${tag_v}]) — bỏ qua vì ALLOW_UNVERIFIED_GIT_SIGNATURE=true"
            else
              echo "FATAL: commit/tag chưa được GitHub xác nhận 'Verified' (commit=[${commit_v}] tag=[${tag_v}]). Ký commit + 'git tag -s' (docs/release/release-process.md B5/R6) rồi tag lại." >&2
              exit 1
            fi
          fi
          test "$(find release-assets -maxdepth 1 -type f -name 'TextVN-portable-*.zip' | wc -l)" -eq 2
          test "$(find release-assets -maxdepth 1 -type f -name 'TextVN-portable-*-windows-x64-*.zip' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name 'TextVN-portable-*-windows-arm64-*.zip' | wc -l)" -eq 1
          # Per-user (mac dinh) + machine (Store bien the HKLM) = dung 2 exe.
          test "$(find release-assets -maxdepth 1 -type f -name 'TextVN-setup-*.exe' ! -name '*-machine.exe' | wc -l)" -eq 2
          test "$(find release-assets -maxdepth 1 -type f -name 'TextVN-setup-*-windows-x64.exe' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name 'TextVN-setup-*-windows-arm64.exe' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name 'TextVN-setup-*-machine.exe' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name 'TextVN-*-linux-x86_64.tar.gz' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name 'TextVN-*-linux-aarch64.tar.gz' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name '*.pkg' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name '*.zip' | wc -l)" -ge 2
          # MSIX la asset BAT BUOC tu 0.2.17 (yeu cau chu repo: moi release kem msix)
          test "$(find release-assets -maxdepth 1 -type f -name '*.msix' | wc -l)" -eq 2
          test "$(find release-assets -maxdepth 1 -type f -name 'TextVN-*-windows-x64.msix' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name 'TextVN-*-windows-arm64.msix' | wc -l)" -eq 1
          # ARM-W6: goi nop Store = .msixbundle (x64 + arm64)
          test "$(find release-assets -maxdepth 1 -type f -name 'TextVN-*-windows.msixbundle' | wc -l)" -eq 1
          for portable in release-assets/TextVN-portable-*.zip; do
            unzip -p "$portable" RELEASE_REPORT.json | jq -e \
              --arg version "$version" --arg commit "$GITHUB_SHA" \
              '.product == "TextVN" and .version == $version and .git_commit == $commit and .source_tree_clean == true and .status == "release-candidate" and .feature_profile == "tsf-only"'
            if unzip -Z1 "$portable" | grep -qi 'textvn-hook.exe'; then
              echo "Default release must not contain the compatibility hook ($portable)." >&2
              exit 1
            fi
          done
          # Draft-first: tạo release dạng draft, upload hết asset rồi mới public.
          # Upload asset fail giữa chừng (mạng/quota) trước đây để lại release
          # public thiếu asset và guard dưới đây khoá luôn việc chạy lại — draft
          # thì fail vô hại và chạy lại được (upload idempotent với --clobber).
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            draft="$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq '.isDraft')"
            if [ "$draft" != "true" ]; then
              echo 'Release exists and is published; refusing to overwrite immutable assets.' >&2
              exit 1
            fi
            # R2-78: chạy lại tag → draft còn asset của lần build trước (tên ZIP có
            # build-id khác) và --clobber không xoá chúng → phát hành lẫn hai bản.
            gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' |
              while IFS= read -r old; do
                [ -n "$old" ] && gh release delete-asset "${GITHUB_REF_NAME}" "$old" --yes
              done
          else
            # Gói .msix chỉ nộp được khi build với identity Partner Center; identity tạm
            # thì nói rõ để không ai nộp nhầm (msix-submission.md §3).
            if [ -n "$(printf '%s' "${MSIX_IDENTITY_NAME:-}" | tr -d '[:space:]')" ]; then
              msix_note="Bản Microsoft Store (khuyên dùng trên Windows, Store tự cập nhật): https://apps.microsoft.com/store/detail/9NV2R7JNNFGK?cid=DevShareMCLPCB — hoặc winget install --id 9NV2R7JNNFGK -s msstore. File .msix ở đây là gói nộp Store (chưa ký, Store tự ký) — không cài trực tiếp được."
            else
              msix_note="File .msix mang identity TẠM — chỉ để thử, KHÔNG nộp Microsoft Store; gói nộp Store build lại bằng workflow release-candidate chạy tay trên tag này với ô msix_identity_name (docs/release/msix-submission.md §3)."
            fi
            gh release create "${GITHUB_REF_NAME}" --draft --verify-tag --prerelease \
              --title "TextVN ${version} (release candidate)" \
              --notes "Bản release candidate do workflow này build và test từ ${GITHUB_SHA}. Mọi file đều có chữ ký GPG tách rời (.asc — khoá FPR 3921595ABC961199F15303B6C45B84D0C7F4A822, public key gpg-release-key.asc đính kèm) và chữ ký Sigstore keyless (.cosign.sig + .cosign.cert); SHA256SUMS.txt được clearsign. Cách kiểm: docs/release/signing.md. Thay đổi: CHANGELOG.md. ZIP Windows chứa RELEASE_REPORT.json. Chưa có: Authenticode cho Windows (đang chờ SignPath Foundation duyệt — SmartScreen có thể cảnh báo) và Developer ID + notarization cho macOS (Gatekeeper cảnh báo lần mở đầu). ${msix_note}"
          fi
          cp docs/release/signing/gpg-release-key.asc release-assets/
          (cd release-assets && sha256sum * > SHA256SUMS.txt)
          # Homebrew cask (bước B7b): sha256 của zip macOS chỉ biết sau build — nhắc
          # đúng dòng cần commit thay vì để cask lệch nhiều bản (R2-76).
          mac_zip="$(cd release-assets && ls TextVN-macos-universal-v*.zip 2>/dev/null | head -1)"
          if [ -n "$mac_zip" ]; then
            want="$(cd release-assets && sha256sum "$mac_zip" | cut -d' ' -f1)"
            have="$(sed -n 's/^  sha256 "\([0-9a-f]*\)"/\1/p' packaging/homebrew/textvn.rb)"
            if [ "$want" != "$have" ]; then
              echo "::warning title=Homebrew cask::packaging/homebrew/textvn.rb cần sha256 \"$want\" cho $mac_zip (bước B7b release-process)"
            fi
          fi
          chmod +x tools/release/sign-artifacts.sh
          bash tools/release/sign-artifacts.sh release-assets
          gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
          gh release edit "${GITHUB_REF_NAME}" --draft=false
