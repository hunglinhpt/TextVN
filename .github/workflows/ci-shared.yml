# CI phần dùng chung (P0-1 §4) — gate: 100% pass.
# Phạm vi: core/ffi/strategy/config/appdb/cli + corpus/shared.
# KHÔNG gồm ci-windows/ci-macos/ci-linux (thuộc adapter từng OS).
name: ci-shared

on:
  push:
    branches: [main]
    # Push chỉ chứa docs/graphify không đổi code Rust — đừng đốt full matrix
    # (13 job) và đừng cancel run của commit code đang chạy.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'graphify-out/**'
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Log không bao giờ chứa nội dung phím (S2) — biến này để tắt log nóng của engine.
  RUST_LOG: warn

# Không job nào ở đây cần ghi repo — token chỉ đọc kể cả khi action bên thứ ba
# (pin theo tag động) bị chiếm.
permissions:
  contents: read

concurrency:
  group: ci-shared-${{ github.ref }}
  # main KHÔNG cancel-in-progress: push graphify/docs ngay sau commit code từng
  # giết run CI của commit code → mất bằng chứng xanh cho commit đó (2026-09-30).
  # PR thì cancel bản cũ để tiết kiệm runner.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      # R2-85: build phát hành chạy `--locked` — bump version mà quên Cargo.lock
      # thì báo ở đây, không đợi tới lúc tag.
      - name: Cargo.lock khớp Cargo.toml
        run: cargo metadata --locked --format-version 1 > /dev/null

  clippy:
    name: clippy (-D warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  clippy-windows:
    # R2-84: code cfg(windows) (tray, TSF, hook, cli) chỉ được clippy trên Windows trong
    # build-release.ps1 — và bản mặc định LOẠI textvn-win-hook. Cross-check target
    # MSVC trên Linux (không link) phủ cả hook, nhanh, không cần runner Windows.
    name: clippy Windows target (cross-check, gồm hook)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-msvc -- -D warnings

  linux-common-sanitizers:
    # R2-79: test C của linux-common (IPC client: SIGPIPE, frame dở dang, header) chạy
    # với ASan + UBSan — trước đây chỉ e2e build Release, lỗi bộ nhớ lọt qua.
    name: linux-common tests (ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release -p textvn-ffi
      - name: cmake Debug + -fsanitize=address,undefined → ctest
        run: |
          cmake -S adapters/linux-common -B build-asan -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-asan -j
          ctest --test-dir build-asan --output-on-failure

  abi-sizes:
    timeout-minutes: 15
    # P0-2 §6: struct FFI lệch kích thước = sửa ABI mà chưa bump IME_ABI_VERSION.
    name: abi sizes (20/532)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo run -q -p textvn-cli -- sizes

  gen-tables:
    timeout-minutes: 20
    # Bảng transform/method phải khớp `data/tables/*.toml` (P0-1 §3) — gate chống
    # "sửa data nhưng quên gen" và ngược lại.
    name: xtask check-tables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt
      - run: cargo run -q -p xtask -- check-tables
      # tools/mac/targets/*.json (MAC-061) là nguồn sự thật của harness AX — gate
      # preset/role/locator chạy được trên mọi OS, không cần máy Mac.
      - run: cargo run -q -p xtask -- check-mac-targets
      # R2-80: trước chỉ chạy trong ci-macos (path filter không gồm corpus/win).
      - run: cargo run -q -p xtask -- check-win-corpus
      # Plist/manifest/iss/cask/AppStream ghi version tay phải khớp Cargo.toml
      # (review R3 F3-10 + blocker 1: installer kẹt 0.1.0 khi exe đã 0.2.0).
      - run: cargo run -q -p xtask -- check-version-sync

  abi-header:
    timeout-minutes: 15
    # Header C giữ tay (chưa có `xtask cbindgen`) → verify header ↔ code Rust (P0-2 §6).
    name: textvn verify (header C)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo run -q -p textvn-cli -- verify

  perf:
    timeout-minutes: 60
    # P1-5 §5: hồi quy p50 > 10% → fail. So **A/B trên cùng runner**: baseline được đo
    # lại từ merge-base với main ngay trong job, rồi đo HEAD. So với file tĩnh
    # `perf/baseline-win.json` (đo trên máy khác) thì runner GHA chung 2 vCPU cho chênh
    # ±20% dù code nhanh hơn (2026-10-08: HEAD nhanh hơn main 6% cục bộ mà job vẫn đỏ
    # +20.6%). File tĩnh vẫn được so nhưng chỉ cảnh báo. Job giữ `continue-on-error`.
    name: perf regression (P1-5 §5)
    runs-on: windows-latest      # baseline là của Windows
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: A/B — baseline = merge-base với origin/main, đo trên cùng runner
        shell: bash
        # Cùng cờ build cho HAI bên (base cũ không có +crt-static trong .cargo/config —
        # so lệch cờ CRT từng ra +13.8% parse_config giả, 2026-10-08).
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          set -euo pipefail
          base="$(git merge-base HEAD origin/main)"
          echo "base=$base head=$(git rev-parse HEAD)"
          git worktree add -q ../perf-base "$base"
          (cd ../perf-base && cargo build -q --release -p textvn-bench)
          cargo build -q --release -p textvn-bench
          # Đo xen kẽ; chỉ coi là hồi quy khi lần đo lại (base mới + HEAD) VẪN vượt ngưỡng —
          # một lượt chậm trên runner chung 2 vCPU là nhiễu, hai lượt liên tiếp là thật.
          for attempt in 1 2; do
            (cd ../perf-base && cargo run -q --release -p textvn-bench -- write "$GITHUB_WORKSPACE/perf/ab-base.json")
            if cargo run -q --release -p textvn-bench -- check perf/ab-base.json; then exit 0; fi
            echo "::warning::A/B lượt $attempt vượt ngưỡng — đo lại"
          done
          exit 1
      - name: So baseline tĩnh (chỉ cảnh báo)
        shell: bash
        run: |
          cargo run -q --release -p textvn-bench -- check perf/baseline-win.json \
            || echo "::warning::lệch so perf/baseline-win.json (đo trên máy khác) — xem bước A/B"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-baseline-win-report
          path: |
            perf/baseline-win.json
            perf/ab-base.json
          if-no-files-found: ignore

  deny:
    timeout-minutes: 20
    # S5: gate dependency (network/http/ws/mqtt trong core/strategy/adapters).
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: taiki-e/install-action@5d880190e41a7608c29a5c91c6b5d24561d53850 # cargo-deny
      - run: cargo deny check

  reuse:
    timeout-minutes: 15
    name: reuse (SPDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # @v6 = reuse-tool 6.x (spec 3.3, đọc REUSE.toml) — @v3 = tool 3.0 CHỈ
      # đọc .reuse/dep5 → fail 0/302 copyright (đã reproduce local, F6-14).
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6

  test:
    timeout-minutes: 60
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace

  replay:
    timeout-minutes: 45
    # L2 golden corpus + L3 cross-OS conformance (P0-4 §1).
    # Adapter mac chạy headless mọi OS (P2-5 §2) — cùng job, 2 run.
    name: replay corpus (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo run -q -p textvn-cli -- replay corpus/shared --adapter headless
      # Mô hình composition của TSF adapter (Windows) trên toàn bộ corpus.
      - run: cargo run -q -p textvn-cli -- replay corpus/shared corpus/win --adapter tsf
      - run: cargo run -q -p textvn-cli -- replay corpus/shared corpus/mac --adapter mac
      # Adapter linux (IBus/Fcitx5) dùng CÙNG profile composition như mac —
      # chạy để regression EN/VI-detect (0.2.13) phủ luôn nền tảng Linux.
      - run: cargo run -q -p textvn-cli -- replay corpus/shared --adapter linux
      - run: cargo run -q -p xtask -- check-mac-corpus

  linux-adapters:
    timeout-minutes: 90
    # Adapter IBus/Fcitx5 build với header THẬT (không mock) + kiểm thử đầu-cuối với
    # ibus-daemon / fcitx5 chạy thật trong dbus-run-session.
    name: Linux IBus/Fcitx5 (build + e2e + gói cài/chạy ngay)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      # Cache chuẩn Swatinem: job này build workspace + adapter Linux (e2e, gói)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake pkg-config \
            libibus-1.0-dev libfcitx5core-dev libfcitx5utils-dev fcitx5-modules-dev \
            libgtk-4-dev ibus fcitx5 fcitx5-modules dbus python3-dbus python3-gi
      - run: scripts/e2e-linux.sh
      # Tarball thật + 2 kịch bản người dùng (cài bằng install.sh / chạy ngay bằng
      # textvn-portable.sh) × IBus + Fcitx5 thật, trong HOME tạm.
      - run: scripts/build-linux.sh --skip-tests
      - run: scripts/test-linux-package.sh dist/TextVN-*-linux-*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: textvn-linux-x86_64
          path: dist/TextVN-*-linux-*.tar.gz*
          if-no-files-found: error

  windows-package:
    # Hai kịch bản người dùng trên Windows thật (runner GitHub, có desktop session — RW5
    # đã verify): (1) giải nén zip portable rồi chạy, (2) cài bằng Inno Setup im lặng
    # machine + kích hoạt user. Mỗi kịch bản gõ tiếng Việt THẬT qua TSF vào Notepad (SendInput VK) rồi gỡ.
    name: Windows package (portable + installer, gõ TSF thật)
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      # STO-03/CI-03: khi chủ repo đặt repo VARIABLES (Settings -> Secrets and
      # variables -> Actions -> Variables) STORE_APP_NAME / STORE_PUBLISHER_NAME,
      # mọi bước validate sẽ đối chiếu ARP với GIÁ TRỊ THẬT trên Partner Center
      # thay vì so code .iss với chính nó. Chưa đặt -> rỗng -> harness dùng
      # mặc định (TextVN / Linh βùi dựng bằng [char]).
      STORE_APP_NAME: ${{ vars.STORE_APP_NAME }}
      STORE_PUBLISHER_NAME: ${{ vars.STORE_PUBLISHER_NAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: x86_64-pc-windows-msvc,i686-pc-windows-msvc
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Inno Setup 6 (bản dịch tiếng Việt cần ≥ 6.5)
        shell: powershell
        run: |
          choco upgrade innosetup --no-progress -y | Out-Null
          $dir = "${env:ProgramFiles(x86)}\Inno Setup 6"
          if (-not (Test-Path "$dir\ISCC.exe")) { throw "ISCC.exe not found in $dir" }
          $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: build-release.ps1 (fmt, clippy, verify, replay, build, smoke, zip, installer)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build-release.ps1 -SkipTests -BuildInstaller
      - name: Kịch bản 2 — giải nén ra dùng luôn (portable zip)
        shell: powershell
        run: |
          $zip = Get-ChildItem dist\TextVN-portable-*.zip | Select-Object -First 1
          powershell -NoProfile -ExecutionPolicy Bypass -File installer\windows\tests\test-portable.ps1 -Zip $zip.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Kịch bản 1 — cài đặt (Inno Setup machine + user activation)
        shell: powershell
        run: |
          $setup = Get-ChildItem dist\TextVN-setup-*.exe | Select-Object -First 1
          if (-not $setup) { throw 'installer was not built' }
          powershell -NoProfile -ExecutionPolicy Bypass -File installer\windows\tests\test-installer.ps1 -Setup $setup.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Gate BAT BUOC (Checklist S - store-submission.md): chay dung 3 buoc
      # manual package validation cua Microsoft tren runner sach: silent install
      # exit 0 khong tuong tac -> ARP name/publisher/version -> dung 1 entry
      # (bundleware) -> silent uninstall sach. Loi = do CI, khong duoc tag.
      - name: Store package validation (MS manual checks, bat buoc)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\win\validate-store-package.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Mo phong DUNG flow Microsoft Store validator tren CHINH ban vua build (R2-81):
      # file gan MOTW nhu vua tai -> chay silent -> check 3 muc.
      - name: Simulate Store validator (download + MOTW + silent + ARP + bundleware)
        shell: powershell
        # Hop thoai chan (vd. canh bao bao mat) tung treo ca job toi khi bi huy sau 60
        # phut (2026-10-09) - script tu gioi han 300 s, day la lop chan cuoi.
        timeout-minutes: 15
        run: |
          $setup = Get-ChildItem dist\TextVN-setup-*-windows-x64.exe | Where-Object { $_.Name -notlike '*-machine.exe' } | Select-Object -First 1
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\win\simulate-store-validation.ps1 -Setup $setup.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Context Matrix Test (audit vong 4 §3.4.3 / STO-02): runner GitHub chay
      # ELEVATED — dung moi truong do CHUNG MINH ban MAY (/DMachineInstall=1)
      # tao duoc entry ARP o HKLM/WOW6432Node (gia thuyet "validator chi doc
      # hive may"), ARP khop tung chu, va go cai sach. Xanh = ban may la lua
      # chon THAT khi VM Store duoc phep elevate; do = gia thuyet bat kha thi
      # trong VM do, phai di duong MSIX.
      - name: Machine-install variant (ARP o HKLM — bang chung cho STO-02)
        # Giai doan dau: chay de LAY BANG CHUNG (log) chu chua phai gate cung —
        # se doi sang blocking sau 2 run xanh lien tiep. Gate cung cho goi nop
        # van la buoc "Store package validation" o tren.
        continue-on-error: true
        shell: powershell
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          # Don sach entry TextVN con sot tu cac buoc truoc (uninstaller Inno
          # chay bat dong bo — cac harness dung truoc da doi, day la luoi an toan).
          $roots = @(
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall',
            'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
          )
          foreach ($r in $roots) {
            Get-ChildItem $r -ErrorAction SilentlyContinue | ForEach-Object {
              $p = Get-ItemProperty $_.PSPath -ErrorAction SilentlyContinue
              if ($p.DisplayName -like '*TextVN*') {
                Write-Host "Don entry con sot: $($_.PSPath)"
                Remove-Item $_.PSPath -Recurse -Force -ErrorAction SilentlyContinue
              }
            }
          }
          & $iscc "/DMyAppVersion=$ver" /DMachineInstall=1 '/DOutputSuffix="-machine"' installer\windows\TextVN-setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\win\validate-store-package.ps1 -MachineOnly -Setup "dist\TextVN-setup-$ver-windows-x64-machine.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # MSIX la asset BAT BUOC cua moi release (0.2.17+): build ngay o day de
      # bat loi som moi commit thay vi doi den luc tag (release.yml cung build).
      - name: Build MSIX (bat buoc cho release)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\win\build-msix.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # R2-09: makeappx chi kiem XSD — luat Partner Center (Version phan dau != 0,
      # Publisher/DisplayName, encoding mo ta, kich thuoc anh, payload) kiem o day.
      - name: Verify MSIX (luat Store + payload)
        shell: bash
        run: |
          ver="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          python tools/win/verify-msix.py dist/TextVN-*-windows-x64.msix --expect-version "$ver"
      # R2-02/R2-04: kenh Store chay THAT tren Windows — cai goi da ky tam, mo app,
      # kiem tu shell ngoai goi (stage that, TIP HKCU, tray ngoai container, Run),
      # go goi roi --msix-guard phai don sach.
      - name: MSIX sideload (cai that, mo app, go goi)
        shell: powershell
        run: |
          $msix = Get-ChildItem dist\TextVN-*-windows-x64.msix | Select-Object -First 1
          powershell -NoProfile -ExecutionPolicy Bypass -File installer\windows\tests\test-msix-sideload.ps1 -Msix $msix.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: textvn-windows-x64
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.msix
            dist/SHA256SUMS-*.txt
          if-no-files-found: warn


  fuzz:
    timeout-minutes: 45
    # L4: 60s/target ở PR (P0-4 §1). Nightly 10'/target nằm ở nightly.yml.
    name: fuzz smoke (60s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f0d5300ba8908d942c808f4d31c08471d7798ba3 # nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: cargo-fuzz
      # install-action cài cargo-fuzz dạng static musl -> cargo-fuzz tự lấy
      # target = triple nó compile (= musl) -> ASAN "incompatible with
      # statically linked libc" (F6-15, rust-fuzz/cargo-fuzz#398). Ghi rõ
      # --target gnu: std + g++ host có sẵn, ASAN link được.
      - name: fuzz ffi_key
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ffi_key --features ffi-fuzz -- -max_total_time=60
      - name: fuzz config_parse
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu config_parse --features ffi-fuzz -- -max_total_time=60
      - name: fuzz appdb_parse
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu appdb_parse -- -max_total_time=60
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
