# SPDX-License-Identifier: GPL-3.0-or-later
# ci-macos — CI cho adapter macOS (P2-5 §8, MAC-064).
#
# Trigger: PR/push chạm adapter macOS, corpus mac/shared, hoặc phần dùng chung mà
# job ở đây chạy (core/config/ffi/cli/xtask). Trước đây thiếu `core/**` nên sửa
# engine không hề chạy gate macOS.
#
# Jobs:
#  - packaging-lint : `bash -n` script macOS (shell 3.2) + `plutil -lint` plist +
#                     Info.plist IMK keys không lệch giữa 2 bản + header C-ABI
#                     trong module Swift không stale so với `ffi/include/`
#  - engine-static  : cargo engine 2 arch mac (aarch64 + x86_64) + lipo (MAC-003)
#  - swift          : build (kèm test bundle) cả 3 package × 2 arch; swift test trên arm64
#  - corpus-mac     : replay corpus (shared + mac) --adapter mac + ABI gates
#  - package-candidate : ZIP/PKG unsigned (không gắn nhãn production)
name: ci-macos

on:
  push:
    branches: [main]
    paths:
      - "adapters/macos-imk/**"
      - "adapters/macos-tap/**"
      - "adapters/macos-app/**"
      - "corpus/mac/**"
      - "corpus/shared/**"
      - "core/**"
      # R2-163: `textvn-math` là dep của core -> được compile vào staticlib macOS
      # (ffi -> core -> math) nhưng thiếu trong path filter nên sửa math-only không
      # kích hoạt ci-macos. Thêm vào cả push lẫn pull_request.
      - "math/**"
      # `dict/**` + `assist/**`: bước "Build textvn-dict với feature os-macos"
      # ở job engine-static chỉ có tác dụng nếu sửa 2 crate này cũng chạy workflow.
      - "dict/**"
      - "assist/**"
      - "config/**"
      - "ffi/**"
      - "cli/**"
      - "xtask/**"
      - "data/tables/keymap_mac.toml"
      - "scripts/build-macos.sh"
      - "scripts/install_macos.sh"
      - "scripts/uninstall_macos.sh"
      - "scripts/package-macos-pkg.sh"
      # ARM-M1: self-test gate universal chay trong packaging-lint — sua script
      # gate cung phai kich hoat ci-macos.
      - "scripts/test-macos-universal-gate.sh"
      - "scripts/notarize-macos.sh"
      - "tools/mac/**"
      - "tools/e2e/**"
      - "packaging/macos/**"
      # B7b: moi release cap nhat sha256 formula homebrew cho macOS — keo theo
      # job macOS de commit B7b cung co check macOS xanh (chu repo yeu cau 2026-10-03).
      - "packaging/homebrew/**"
      - ".github/workflows/ci-macos.yml"
  pull_request:
    paths:
      - "adapters/macos-imk/**"
      - "adapters/macos-tap/**"
      - "adapters/macos-app/**"
      - "corpus/mac/**"
      - "corpus/shared/**"
      - "core/**"
      # R2-163: `textvn-math` là dep của core -> được compile vào staticlib macOS
      # (ffi -> core -> math) nhưng thiếu trong path filter nên sửa math-only không
      # kích hoạt ci-macos. Thêm vào cả push lẫn pull_request.
      - "math/**"
      # `dict/**` + `assist/**`: bước "Build textvn-dict với feature os-macos"
      # ở job engine-static chỉ có tác dụng nếu sửa 2 crate này cũng chạy workflow.
      - "dict/**"
      - "assist/**"
      - "config/**"
      - "ffi/**"
      - "cli/**"
      - "xtask/**"
      - "data/tables/keymap_mac.toml"
      - "scripts/build-macos.sh"
      - "scripts/install_macos.sh"
      - "scripts/uninstall_macos.sh"
      - "scripts/package-macos-pkg.sh"
      # ARM-M1: self-test gate universal chay trong packaging-lint — sua script
      # gate cung phai kich hoat ci-macos.
      - "scripts/test-macos-universal-gate.sh"
      - "scripts/notarize-macos.sh"
      - "tools/mac/**"
      - "tools/e2e/**"
      - "packaging/macos/**"
      # B7b: moi release cap nhat sha256 formula homebrew cho macOS — keo theo
      # job macOS de commit B7b cung co check macOS xanh (chu repo yeu cau 2026-10-03).
      - "packaging/homebrew/**"
      - ".github/workflows/ci-macos.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # S2: log không bao giờ chứa nội dung phím.
  RUST_LOG: warn

permissions:
  contents: read

concurrency:
  group: ci-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Rẻ nhất, bắt lớp lỗi "chỉ lộ lúc release": script sai cú pháp bash 3.2,
  # plist/entitlements hỏng, header C-ABI trong package Swift bị stale.
  packaging-lint:
    name: scripts + plist + header C-ABI
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: bash -n (cú pháp bash của mọi script macOS)
        run: |
          # /bin/bash trên runner = 3.2 — đúng shell mà máy macOS có sẵn.
          /bin/bash --version | head -1
          for f in \
            adapters/macos-imk/build-rust.sh \
            scripts/build-macos.sh \
            scripts/install_macos.sh \
            scripts/uninstall_macos.sh \
            scripts/package-macos-pkg.sh \
            scripts/notarize-macos.sh \
            scripts/test-macos-universal-gate.sh \
            packaging/macos/pkg-scripts/postinstall \
            packaging/macos/uninstall-check.sh \
            tools/mac/soak.sh \
            tools/mac/smoke-imk.sh \
            tools/mac/mem-check.sh ; do
            { [ -f "$f" ] && /bin/bash -n "$f"; } || { echo "::error file=$f::bash -n lệch cú pháp"; exit 1; }
            echo "ok  bash -n $f"
          done

      - name: Lint cú pháp bash 4+ (script phải chạy được trên bash 3.2 của macOS)
        run: |
          # macOS chỉ có bash 3.2: các cú pháp bash 4+ dưới đây chết ở *runtime*
          # (không phải syntax error) nên `bash -n` bằng bash 5 không bắt được.
          # shellcheck disable=SC2086 — cố ý tách word cho danh sách file
          PATTERNS='declare -A|local -A|readarray|mapfile|\$\{[A-Za-z_][A-Za-z0-9_]*(,,|\^\^)\}|&>>|;;&'
          FILES='adapters/macos-imk/build-rust.sh scripts/build-macos.sh
                 scripts/install_macos.sh scripts/uninstall_macos.sh
                 scripts/package-macos-pkg.sh packaging/macos/uninstall-check.sh
                 scripts/notarize-macos.sh packaging/macos/pkg-scripts/postinstall
                 scripts/test-macos-universal-gate.sh
                 tools/mac/soak.sh tools/mac/smoke-imk.sh tools/mac/mem-check.sh'
          if printf '%s\n' $FILES | xargs grep -nE "$PATTERNS" ; then
            echo "::error::có cú pháp bash 4+ — macOS chỉ có bash 3.2"
            exit 1
          fi
          echo "ok  không có cú pháp bash 4+"

      # ARM-M1: self-test + đột biến (D3) gate universal — fixture stub 1 arch
      # phải ĐỎ (exit 1), fixture universal + file thường phải xanh. Chạy được
      # trên bash 3.2 (không cần lipo — lipo giả qua TEXTVN_UNI_LIPO).
      - name: Self-test + đột biến gate universal ARM-M1
        run: scripts/test-macos-universal-gate.sh

      - name: plutil -lint + XML strict (plist + entitlements + component.plist)
        run: |
          files="packaging/macos/Info-IM.plist packaging/macos/Info-App.plist
                 packaging/macos/TextVN.entitlements packaging/macos/component.plist
                 adapters/macos-imk/Resources/Info.plist
                 adapters/macos-imk/TextVN-IM.entitlements"
          for f in $files; do
            plutil -lint "$f"
          done
          # plutil/CFPropertyList nuốt được XML sai well-formed (vd hai dấu gạch
          # liền nhau trong comment) — xmllint strict thì không (review R3 F3-11;
          # từ E59 thay heredoc python3 bằng xmllint — macOS có sẵn /usr/bin/xmllint,
          # không mang thêm runtime ngôn ngữ vào CI).
          for f in $files; do
            xmllint --noout "$f"
            echo "ok  strict $f"
          done

      - name: Info.plist IMK keys khớp giữa 2 bản (lệch = input source không hiện)
        run: |
          for key in CFBundleIdentifier InputMethodConnectionName \
                     InputMethodServerControllerClass TISInputSourceID ; do
            a="$(plutil -extract "$key" raw -o - packaging/macos/Info-IM.plist)"
            b="$(plutil -extract "$key" raw -o - adapters/macos-imk/Resources/Info.plist)"
            if [ "$a" != "$b" ]; then
              echo "::error::plist lệch key $key — packaging/macos/Info-IM.plist='$a' vs Resources/Info.plist='$b'"
              exit 1
            fi
            echo "ok  $key = $a"
          done

      - name: header C-ABI trong module Swift không được lệch ffi/include/
        run: |
          cp ffi/include/textvn_ffi.h adapters/macos-imk/Sources/CTextVNFFI/include/
          if ! git diff --quiet -- adapters/macos-imk/Sources/CTextVNFFI/include/textvn_ffi.h; then
            echo "::error::header C-ABI stale — copy lại từ ffi/include/textvn_ffi.h rồi commit"
            git --no-pager diff --stat -- adapters/macos-imk/Sources/CTextVNFFI/include/textvn_ffi.h
            exit 1
          fi
          echo "ok  header C-ABI khớp ffi/include/"

  engine-static:
    name: engine staticlib universal (2 arch + lipo)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain + mac targets (MAC-001)
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustc --version

      # Feature `os-macos` MẶC ĐỊNH TẮT (dict/Cargo.toml) ⇒ cargo build/clippy/test
      # mặc định KHÔNG compile nhánh `dict/src/os_macos.rs` (NSSpellChecker, FFI
      # Objective-C runtime) — code có thể hỏng âm thầm mà CI vẫn xanh. Build
      # (codegen thật) trên SDK macOS để bắt drift AS-042.
      - name: Build textvn-dict với feature os-macos (NSSpellChecker)
        run: cargo build -p textvn-dict --features os-macos --target aarch64-apple-darwin

      - name: Build staticlib 2 arch + lipo
        run: |
          cd adapters/macos-imk
          ./build-rust.sh --lib-only
          lipo -info lib/libtextvn_ffi.a | grep -E "x86_64.*arm64|arm64.*x86_64"

  swift:
    name: swift build + test (${{ matrix.arch }})
    runs-on: macos-latest
    # KHÔNG `needs: engine-static`: job này tự build staticlib per-arch ở bước
    # dưới (engine-static build cho target/release của package-candidate) —
    # `needs` chỉ gây serialize 2 job build độc lập.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # arch        = tên Swift/lipo (arm64)
          # rust_target = triple Rust (**aarch64**, KHÔNG phải arm64) — MAC-031
          - arch: arm64
            rust_target: aarch64-apple-darwin
          - arch: x86_64
            rust_target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain (lib link cho swift test)
        run: rustup target add ${{ matrix.rust_target }}

      # Chạy cargo từ **workspace root**: `target/` nằm ở gốc repo — không phải
      # trong `adapters/macos-imk/` (bug MAC-031/F2-050).
      - name: Build staticlib cho arch này
        run: |
          cargo build --target ${{ matrix.rust_target }} -p textvn-ffi
          mkdir -p adapters/macos-imk/lib
          cp target/${{ matrix.rust_target }}/debug/libtextvn_ffi.a adapters/macos-imk/lib/

      # x86_64: build CẢ test bundle (compile + link đủ) nhưng chỉ CHẠY test trên
      # arm64 — `swiftpm-testing-helper` của runner arm64 không dlopen được bundle
      # x86_64 ("doesn't contain a version for the current architecture", MAC-032).
      # Logic test không phụ thuộc arch; arch chỉ ảnh hưởng compile/link.
      - name: swift build + test (IMK adapter — MAC-030)
        working-directory: adapters/macos-imk
        run: |
          swift build --arch ${{ matrix.arch }} --build-tests
          if [ "${{ matrix.arch }}" = "arm64" ]; then swift test --arch arm64; fi

      # 3 package độc lập (staticlib đã có từ bước trên) — IMK lỗi vẫn build/test
      # tap + app để một lần chạy CI báo đủ lỗi cả 3; job vẫn fail như cũ.
      - name: swift build + test (tap opt-in — P2-2 §8)
        if: ${{ !cancelled() }}
        working-directory: adapters/macos-tap
        run: |
          set -o pipefail
          # GitHub ẩn log job với người chưa đăng nhập. Đưa tối đa 10 dòng
          # compiler/test error vào check-run annotations để audit công khai.
          # Đây chỉ là output build/test của source, không chứa phím người dùng.
          if ! swift build --arch ${{ matrix.arch }} --build-tests 2>&1 | tee tap-build.log; then
            grep -E 'error:|failed|Failure' tap-build.log | head -10 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            if ! swift test --arch arm64 2>&1 | tee tap-test.log; then
              grep -E 'error:|failed|Failure' tap-test.log | head -10 | while IFS= read -r line; do
                echo "::error::$line"
              done
              exit 1
            fi
          fi

      - name: swift build + test (menu bar app and settings)
        if: ${{ !cancelled() }}
        working-directory: adapters/macos-app
        run: |
          swift build --arch ${{ matrix.arch }} --build-tests
          if [ "${{ matrix.arch }}" = "arm64" ]; then swift test --arch arm64; fi

  corpus-mac:
    name: replay corpus --adapter mac
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt
      - name: gen-tables + corpus check (nguồn không được lệch)
        run: |
          cargo run -q -p xtask -- check-tables
          cargo run -q -p xtask -- check-mac-corpus
          cargo run -q -p xtask -- check-win-corpus
      - name: replay shared + mac (P2-5 §1 — lớp corpus)
        run: |
          cargo run -q -p textvn-cli -- replay corpus/shared --adapter mac
          cargo run -q -p textvn-cli -- replay corpus/mac    --adapter mac

      - name: ABI gates (P0-2 §6)
        run: |
          cargo run -q -p textvn-cli -- sizes
          cargo run -q -p textvn-cli -- verify

  package-candidate:
    name: unsigned macOS package candidate (2 arch)
    runs-on: macos-latest
    needs: [packaging-lint, swift, corpus-mac]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build bundles and package
        run: |
          scripts/build-macos.sh
          scripts/package-macos-pkg.sh
      - name: Keep candidate artifacts for native GUI/signing review
        uses: actions/upload-artifact@v4
        with:
          name: TextVN-macos-candidate-${{ github.sha }}
          path: |
            dist/macos/*.zip
            dist/macos/*.tar.gz
            dist/macos/*.pkg
            dist/macos/SHA256SUMS*.txt
          if-no-files-found: error

  # ARM-M2: E2E IMK gõ THẬT trên runner macOS arm64 — cài TextVN-IM từ chính gói candidate,
  # đăng ký/bật/chọn input source qua TIS (tools/mac/tis-select.swift), gõ 6 case corpus/mac +
  # undo + toggle EN/VN vào TextEdit (tools/mac/smoke-imk.sh). Runner thiếu quyền Accessibility/GUI
  # ⇒ smoke exit 3: ghi GIỚI HẠN rõ ràng (::warning:: + job summary), KHÔNG pass ngầm; TIS lỗi
  # hoặc gõ sai = ĐỎ. Lớp cầu (bridge) IMK vẫn được gate ở job `swift` (IMKLibTests).
  imk-e2e:
    name: IMK E2E gõ thật (TextEdit, arm64)
    runs-on: macos-latest
    needs: package-candidate
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Runner phải là Apple Silicon (arm64)
        run: test "$(uname -m)" = arm64
      - uses: actions/download-artifact@v4
        with:
          name: TextVN-macos-candidate-${{ github.sha }}
          path: candidate
      - name: Cài gói .pkg candidate (như người dùng) → /Library/Input Methods
        run: |
          set -euo pipefail
          pkg="$(ls candidate/*.pkg | head -n1)"
          echo "pkg: $pkg"
          sudo installer -pkg "$pkg" -target / | tail -n 3
          app="/Library/Input Methods/TextVN-IM.app"
          test -d "$app"
          exe="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          archs="$(lipo -archs "$app/Contents/MacOS/$exe")"
          echo "TextVN-IM archs: $archs"
          grep -qw arm64 <<<"$archs"
          # Chẩn đoán TIS (ARM-M2): chữ ký + khoá input source trong Info.plist.
          codesign -dv --verbose=2 "$app" 2>&1 | grep -E "^(Identifier|Format|Signature|TeamIdentifier|flags)" || echo "(codesign: chưa ký)"
          for k in CFBundleIdentifier TISInputSourceID InputMethodConnectionName InputMethodServerControllerClass; do
            echo "  $k = $(/usr/libexec/PlistBuddy -c "Print :$k" "$app/Contents/Info.plist" 2>/dev/null || echo "<thiếu>")"
          done
          # Lần chạy 08a93cfd: cài vào ~/Library/Input Methods thì TIS (318 nguồn) KHÔNG bao giờ liệt kê
          # TextVN dù TISRegisterInputSource = noErr ⇒ đi đúng đường gói .pkg + đăng ký LaunchServices.
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f -R "$app"
          # Mở tiến trình IM (IMKServer tự đăng ký với hệ thống) + nạp lại registry nguồn nhập.
          open -g "$app" || true
          sleep 5
          killall TextInputMenuAgent 2>/dev/null || true
      - name: Đăng ký + bật + chọn input source (TIS)
        id: tis
        run: |
          set +e
          swift tools/mac/tis-select.swift "/Library/Input Methods/TextVN-IM.app" vn.textvn.im
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" = 3 ]; then
            msg="runner macos-latest không liệt kê input method bên thứ ba qua TIS dù .pkg cài thành công + TISRegisterInputSource = noErr (đã thử lsregister, mở IM, nạp lại TextInputMenuAgent)"
            echo "::warning title=ARM-M2 giới hạn runner::$msg. Gate còn lại: cài .pkg + lipo arm64 + plist/codesign (bước trên), IMKLibTests (job swift), replay --adapter mac."
            { echo "### ARM-M2 — IMK E2E gõ thật"; echo; echo "**GIỚI HẠN**: $msg."; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$rc"
      - name: Gõ thật vào TextEdit qua IMK (smoke-imk.sh)
        if: steps.tis.outputs.rc == '0'
        run: |
          set +e
          open -a TextEdit
          for _ in $(seq 1 20); do pgrep -x TextVN-IM >/dev/null && break; sleep 0.5; done
          pgrep -lx TextVN-IM || echo "(TextVN-IM chưa chạy — smoke sẽ báo lý do)"
          bash tools/mac/smoke-imk.sh 2>&1 | tee smoke.log
          rc=${PIPESTATUS[0]}
          {
            echo "### ARM-M2 — IMK E2E gõ thật (TextEdit, arm64)"
            echo
            echo '```'
            cat smoke.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          case "$rc" in
            0) echo "IMK E2E PASS" ;;
            3)
              reason="$(grep -m1 'SKIP' smoke.log || echo 'SKIP không rõ lý do')"
              echo "::warning title=ARM-M2 giới hạn runner::IMK E2E không chạy được trên runner này — $reason. Gate còn lại: IMKLibTests (job swift) + replay --adapter mac."
              echo "**GIỚI HẠN**: $reason" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *) echo "::error::IMK E2E đỏ (exit $rc) — xem smoke.log"; exit "$rc" ;;
          esac
