# ci-aur.yml — QA gate cho gói AUR, chạy trên CÂY HIỆN TẠI (bắt lỗi build
# trước khi release, ví dụ R2-117: header Fcitx5 6.x cần C++20 — tag cũ chết).
#
# Hai lớp:
#  1. Metadata AUR: .SRCINFO khớp `makepkg --printsrcinfo` của PKGBUILD gốc.
#  2. Build thật: tạo source archive từ checkout (giống bố cục archive GitHub —
#     thư mục gốc TextVN-<ver>), sao PKGBUILD đổi 1 dòng `source` sang file
#     cục bộ + hash thật rồi makepkg -f — cùng các bước build/check/package
#     như người dùng AUR sẽ chạy. PKGBUILD gốc không đổi (AUR vẫn trỏ GitHub;
#     hash pin của tag archive là việc B7e sau khi tag).
name: ci-aur

on:
  push:
    paths:
      - 'packaging/arch/**'
      - 'adapters/**'
      - 'core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci-aur.yml'
  pull_request:
    paths:
      - 'packaging/arch/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  makepkg:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Phụ thuộc build (rust/cmake + dev headers IBus/Fcitx5/GTK4)
        run: |
          pacman -Syu --noconfirm --needed \
            git rust cmake pkgconf ibus fcitx5 gtk4

      - name: Checkout
        uses: actions/checkout@v4

      # makepkg từ chối chạy bằng root → user builder với HOME riêng.
      - name: Build bằng makepkg (user thường)
        run: |
          useradd -m builder
          cp -r . /home/build
          mkdir -p /home/build/pkg
          cp /home/build/packaging/arch/PKGBUILD /home/build/packaging/arch/.SRCINFO /home/build/pkg/
          chown -R builder:builder /home/build
          VERSION=$(sed -n 's/^pkgver=//p' /home/build/pkg/PKGBUILD | head -n1)
          cd /home/build
          # Source archive cục bộ bố cục giống GitHub: thư mục gốc TextVN-<ver>.
          # (chạy bằng builder — git từ chối repo owner khác: dubious ownership)
          sudo -u builder git archive --format=tar.gz \
            --prefix="TextVN-$VERSION/" HEAD -o "pkg/textvn-$VERSION.tar.gz"
          REAL_SHA=$(sha256sum "pkg/textvn-$VERSION.tar.gz" | cut -d' ' -f1)
          # Bản sao PKGBUILD dùng archive cục bộ (1 dòng khác — PKGBUILD AUR gốc
          # vẫn trỏ GitHub tag). makepkg thấy source file sẵn trong dir → không tải.
          sed -i \
            -e "s|^source=.*|source=(\"textvn-$VERSION.tar.gz\")|" \
            -e "s|^sha256sums=.*|sha256sums=('$REAL_SHA')|" \
            pkg/PKGBUILD
          cd pkg
          sudo -u builder makepkg -f --noconfirm

      - name: .SRCINFO khớp `makepkg --printsrcinfo` (PKGBUILD AUR gốc)
        run: |
          mkdir -p /home/build/srcinfo
          cp /home/build/packaging/arch/PKGBUILD /home/build/srcinfo/
          chown -R builder:builder /home/build/srcinfo
          cd /home/build/srcinfo
          sudo -u builder makepkg --printsrcinfo > /tmp/generated.srcinfo
          diff -u /home/build/packaging/arch/.SRCINFO /tmp/generated.srcinfo || {
            echo "::error::.SRCINFO lệch — chạy lại 'makepkg --printsrcinfo > packaging/arch/.SRCINFO' và commit";
            exit 1;
          }

      - name: Gói có đủ file then chốt
        run: |
          cd /home/build/pkg
          PKG=$(ls textvn-*.pkg.tar.zst | grep -v debug | head -n1)
          pacman -Qlp "$PKG" | sed 's/^\S* //' > /tmp/pkg-files.txt
          for f in \
            /usr/bin/textvn \
            /usr/bin/textvn-settings \
            /usr/lib/textvn/textvn-ibus-engine \
            /usr/lib/fcitx5/libtextvn-fcitx5.so \
            /usr/share/ibus/component/textvn.xml \
            /usr/share/fcitx5/addon/textvn.conf \
            /usr/share/fcitx5/inputmethod/textvn.conf \
            /usr/share/applications/textvn-settings.desktop \
            /usr/share/metainfo/io.github.hunglinhpt.textvn.metainfo.xml \
            /usr/share/licenses/textvn/LICENSE; do
            grep -qx "$f" /tmp/pkg-files.txt || {
              echo "::error::.pkg thiếu $f"; exit 1;
            }
          done
          grep -E "^/usr/(bin|lib)" /tmp/pkg-files.txt

      - name: Đối chiếu version gói = Cargo.toml
        run: |
          CARGO_VER=$(sed -n 's/^version = "\(.*\)".*/\1/p' /home/build/Cargo.toml | head -n1)
          PKG_VER=$(ls /home/build/pkg/textvn-*.pkg.tar.zst | grep -v debug | head -n1 | sed -E 's#.*/textvn-([^-]+)-.*#\1#')
          [ "$CARGO_VER" = "$PKG_VER" ] || {
            echo "::error::PKGBUILD version $PKG_VER ≠ Cargo.toml $CARGO_VER"; exit 1;
          }

      - name: Upload gói .pkg làm artifact
        uses: actions/upload-artifact@v4
        with:
          name: textvn-aur-package
          path: /home/build/pkg/textvn-*.pkg.tar.zst
          if-no-files-found: error
