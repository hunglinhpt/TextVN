# CI riêng Linux (tách khỏi ci-shared 2026-10-11 — README hiện badge từng nền tảng:
# Windows / Linux / macOS). Phạm vi: linux-common (C, ASan + UBSan) + adapter IBus/Fcitx5
# build với header thật, e2e với ibus-daemon/fcitx5 thật, gói tarball cài/chạy ngay.
# Job giữ NGUYÊN tên như khi còn trong ci-shared.
name: ci-linux

on:
  push:
    branches: [main]
    # Push chỉ chứa docs/graphify không đổi code — đừng đốt runner.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'graphify-out/**'
      # E86: tệp điều phối nhiều agent (board.jsonl, changes/*.md) đổi liên tục — không đốt runner,
      # không đẩy run code đang chờ ra khỏi concurrency group.
      - 'coordination/**'
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Log không bao giờ chứa nội dung phím (S2) — biến này để tắt log nóng của engine.
  RUST_LOG: warn

permissions:
  contents: read

concurrency:
  # E86: push lên main = MỘT nhóm cho MỖI commit (github.sha) — trước đây nhóm theo ref giữ 1 run chạy + 1 run
  # chờ, run chờ mới thay run chờ cũ ⇒ khi nhiều agent cùng đẩy, commit code mất run CI (không có bằng chứng).
  # PR vẫn chung nhóm theo ref và huỷ run cũ.
  group: ci-linux-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  # main KHÔNG cancel-in-progress (giữ bằng chứng xanh cho từng commit); PR thì cancel.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-common-sanitizers:
    # R2-79: test C của linux-common (IPC client: SIGPIPE, frame dở dang, header) chạy
    # với ASan + UBSan — trước đây chỉ e2e build Release, lỗi bộ nhớ lọt qua.
    name: linux-common tests (ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release -p textvn-ffi
      - name: cmake Debug + -fsanitize=address,undefined → ctest
        run: |
          cmake -S adapters/linux-common -B build-asan -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-asan -j
          ctest --test-dir build-asan --output-on-failure
      # ARM-L2: `char` KHÔNG DẤU là mặc định trên aarch64 (có dấu trên x86_64). Lượt thứ hai biên dịch
      # với -funsigned-char -Wsign-compare (+ -Werror sẵn trong CMakeLists) để bắt code giả định dấu của
      # `char` NGAY trên x86 — lượt mặc định ở trên giữ hành vi có dấu; hai lượt cùng xanh mới qua.
      - name: cmake -funsigned-char -Wsign-compare → ctest (char như aarch64)
        run: |
          cmake -S adapters/linux-common -B build-uchar -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-funsigned-char -Wsign-compare"
          cmake --build build-uchar -j
          ctest --test-dir build-uchar --output-on-failure

  linux-adapters:
    timeout-minutes: 90
    # Adapter IBus/Fcitx5 build với header THẬT (không mock) + kiểm thử đầu-cuối với
    # ibus-daemon / fcitx5 chạy thật trong dbus-run-session.
    name: Linux IBus/Fcitx5 (build + e2e + gói cài/chạy ngay)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      # Cache chuẩn Swatinem: job này build workspace + adapter Linux (e2e, gói)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        # E59: bump shared-key — cache cũ bị "độc" từ run abort (SIGABRT dict-entry
        # giữa build CMake để dangling symlinks test_*.dir/tests/target → cache
        # save/restore ENOENT). Key mới = bỏ hẳn cache đó.
        with:
          shared-key: e59-dbus-e2e-v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake pkg-config \
            libibus-1.0-dev libfcitx5core-dev libfcitx5utils-dev fcitx5-modules-dev \
            libgtk-4-dev ibus fcitx5 fcitx5-modules dbus libdbus-1-dev
      - run: scripts/e2e-linux.sh
      # E67: dựng binary EL8 (AlmaLinux 8 = RHEL 8.10 ABI: glibc 2.28, IBus 1.5.19, GTK3 3.22)
      # để gói tarball duy nhất chạy mượt từ RHEL 8.10 / Rocky 8 / Ubuntu 20-22 tới Ubuntu 24 / Arch.
      - name: Build EL8 baseline (RHEL 8.10 glibc 2.28 + GTK3)
        run: |
          cargo fetch --locked
          RUSTUP_DIR="$(rustup show home)"
          CARGO_DIR="${CARGO_HOME:-$HOME/.cargo}"
          HOST_UID="$(id -u)"
          HOST_GID="$(id -g)"
          docker run --rm \
            -v "$PWD:/src" \
            -v "$RUSTUP_DIR:/rustup:ro" \
            -v "$CARGO_DIR:/cargo" \
            -e HOST_UID="$HOST_UID" \
            -e HOST_GID="$HOST_GID" \
            almalinux:8 bash -euo pipefail -c '
              dnf --enablerepo=powertools install -y --setopt=install_weak_deps=False \
                gcc make cmake pkgconf-pkg-config ibus-devel gtk3-devel ibus dbus-daemon dbus-tools procps-ng gawk dconf xkeyboard-config >/dev/null
              groupadd -f -g "$HOST_GID" builder || true
              useradd -m -u "$HOST_UID" -g "$HOST_GID" -o builder
              mkdir -p /tmp/target-el8 && chown -R "$HOST_UID:$HOST_GID" /tmp/target-el8
              su -s /bin/bash builder -c "
                export PATH=/cargo/bin:\$PATH
                export RUSTUP_HOME=/rustup CARGO_HOME=/cargo CARGO_TARGET_DIR=/tmp/target-el8
                export LC_ALL=C.UTF-8 LANG=C.UTF-8
                bash /src/scripts/build-linux-el8.sh /src/target/linux-el8
              "
            '
      # E68: dựng binary compat (Ubuntu 22.04 LTS: glibc 2.35, GLIBCXX 3.4.30, GTK 4.6, Fcitx5 5.0.14)
      # để textvn-settings-gtk4 và libtextvn-fcitx5.so chạy mượt trên Ubuntu 22.04/Mint/Pop!_OS,
      # Debian 12, Ubuntu 24.04, Fedora 40-42, openSUSE Leap 15.6 và Arch.
      - name: Build compat baseline (Ubuntu 22.04 glibc 2.35 + GTK4 + Fcitx5)
        run: |
          RUSTUP_DIR="$(rustup show home)"
          CARGO_DIR="${CARGO_HOME:-$HOME/.cargo}"
          HOST_UID="$(id -u)"
          HOST_GID="$(id -g)"
          docker run --rm \
            -v "$PWD:/src" \
            -v "$RUSTUP_DIR:/rustup:ro" \
            -v "$CARGO_DIR:/cargo" \
            -e HOST_UID="$HOST_UID" \
            -e HOST_GID="$HOST_GID" \
            ubuntu:22.04 bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends \
                build-essential cmake pkg-config libgtk-4-dev \
                libfcitx5core-dev libfcitx5utils-dev fcitx5-modules-dev libdbus-1-dev >/dev/null
              groupadd -f -g "$HOST_GID" builder || true
              useradd -m -u "$HOST_UID" -g "$HOST_GID" -o builder
              mkdir -p /tmp/target-compat && chown -R "$HOST_UID:$HOST_GID" /tmp/target-compat
              su -s /bin/bash builder -c "
                export PATH=/cargo/bin:\$PATH
                export RUSTUP_HOME=/rustup CARGO_HOME=/cargo CARGO_TARGET_DIR=/tmp/target-compat
                export LC_ALL=C.UTF-8 LANG=C.UTF-8
                bash /src/scripts/build-linux-compat.sh /src/target/linux-compat
              "
            '
      # Tarball đa distro duy nhất (EL8 CLI/IBus/GTK3 ≤ glibc 2.28 + Ubuntu 22.04 GTK4/Fcitx5 ≤ glibc 2.35 / GLIBCXX 3.4.30).
      - run: scripts/build-linux.sh --skip-tests --el8-dir target/linux-el8 --compat-dir target/linux-compat
      # 2 kịch bản người dùng (cài bằng install.sh / chạy ngay bằng textvn-portable.sh) × IBus + Fcitx5 trên Ubuntu 24.04.
      - run: scripts/test-linux-package.sh dist/TextVN-*-linux-*.tar.gz
      - name: "PERF-1 — ghi số thật của runner + artifact (R2-176 baseline phải từ CI)"
        run: |
          cargo run -q --release --locked -p textvn-bench -- write --auto
          cat perf/baseline-x86_64-unknown-linux-gnu.json
      - uses: actions/upload-artifact@v4
        with:
          name: baseline-x86_64-linux
          path: perf/baseline-x86_64-unknown-linux-gnu.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: textvn-linux-x86_64
          path: dist/TextVN-*-linux-*.tar.gz*
          if-no-files-found: error
      - run: |
          mkdir -p target/e2e-helpers
          cp -f target/linux-el8/ibus/e2e_ibus target/e2e-helpers/e2e_ibus
          cp -f target/linux-compat/fcitx5/e2e_fcitx5 target/e2e-helpers/e2e_fcitx5
      - uses: actions/upload-artifact@v4
        with:
          name: linux-e2e-helpers
          path: target/e2e-helpers/*
          if-no-files-found: error

  # ARM-L1 (P0-7 Luồng A, P0-5 §9b): CÙNG bộ kiểm thử chạy NATIVE trên Linux aarch64 (Raspberry Pi 5,
  # NVIDIA Jetson/DGX Spark = Ubuntu 24.04 arm64, máy chủ Graviton/Ampere) — không cross-compile, không
  # đụng job x86_64 ở trên. Hai LTS còn hỗ trợ: 24.04 (glibc 2.39, GTK 4.14) + 22.04 (glibc 2.35, GTK 4.6).
  linux-arm64:
    name: Linux aarch64 native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    # Runner ARM chậm hơn x86_64 khi build lạnh (không có cache lần đầu) — timeout riêng.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Kiến trúc phải là aarch64 (chặn runner bị đổi âm thầm sang x86_64)
        run: |
          uname -m
          test "$(uname -m)" = aarch64
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Cache tách theo kiến trúc + bản Ubuntu (glibc khác nhau) — không lẫn với job x86_64.
          shared-key: arm64-${{ matrix.os }}-v1
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake pkg-config \
            libibus-1.0-dev libfcitx5core-dev libfcitx5utils-dev fcitx5-modules-dev \
            libgtk-4-dev ibus fcitx5 fcitx5-modules dbus libdbus-1-dev
      - name: cargo test --workspace (native aarch64)
        run: cargo test --workspace --locked
      - name: verify header C + ABI 20/532 (khác kiến trúc = cùng kích thước)
        run: |
          cargo run -q -p textvn-cli -- verify
          cargo run -q -p textvn-cli -- sizes
      - name: PERF-1 — so baseline hiệu năng ARM64 Linux (aarch64-unknown-linux-gnu)
        run: cargo run -q --release --locked -p textvn-bench -- check --auto
      - name: "PERF-1 — ghi số thật của runner + artifact (R2-176 baseline phải từ CI)"
        run: |
          cargo run -q --release --locked -p textvn-bench -- write --auto
          cat perf/baseline-aarch64-unknown-linux-gnu.json
      - uses: actions/upload-artifact@v4
        with:
          name: baseline-aarch64-linux-${{ matrix.os }}
          path: perf/baseline-aarch64-unknown-linux-gnu.json
          if-no-files-found: error
      - name: replay corpus 4 adapter (headless/tsf/mac/linux)
        run: |
          cargo run -q -p textvn-cli -- replay corpus/shared --adapter headless
          cargo run -q -p textvn-cli -- replay corpus/shared corpus/win --adapter tsf
          cargo run -q -p textvn-cli -- replay corpus/shared corpus/mac --adapter mac
          cargo run -q -p textvn-cli -- replay corpus/shared --adapter linux
      - name: linux-common ctest (ASan + UBSan) trên aarch64
        run: |
          cargo build --release -p textvn-ffi
          cmake -S adapters/linux-common -B build-asan -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-asan -j
          ctest --test-dir build-asan --output-on-failure
      - name: Build adapter IBus/Fcitx5/settings + ctest + e2e ibus-daemon/fcitx5 thật
        run: scripts/e2e-linux.sh

  # E67/E68: kiểm thử ĐÚNG gói tarball phát hành song song trên 6 distro doanh nghiệp & phổ thông hàng đầu
  # (cộng thêm Ubuntu 24.04 ở job trên và Arch Linux ở ci-aur = 8/8 họ distro Linux chính).
  e2e-distro-matrix:
    name: E2E tarball (${{ matrix.label }})
    needs: linux-adapters
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: almalinux-8
            label: RHEL 8.10 / AlmaLinux 8
            image: almalinux:8
            mode: el8
          - tag: almalinux-9
            label: RHEL 9 / AlmaLinux 9
            image: almalinux:9
            mode: matrix
          - tag: opensuse-leap-15-6
            label: SLES 15 / openSUSE Leap 15.6
            image: opensuse/leap:15.6
            mode: matrix
          - tag: ubuntu-22-04
            label: Ubuntu 22.04 LTS / Mint 21
            image: ubuntu:22.04
            mode: matrix
          - tag: debian-12
            label: Debian 12 Bookworm
            image: debian:12
            mode: matrix
          - tag: fedora-41
            label: Fedora 41 / RHEL 10 upstream
            image: fedora:41
            mode: matrix
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: textvn-linux-x86_64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: linux-e2e-helpers
          path: e2e-helpers
      # G22 (COMPAT-2): khối docker-run (deps distro, machine-id, user tester) là MỘT nguồn
      # scripts/run-distro-container.sh — dùng chung với release.yml (x86_64 + arm64).
      - name: Run container E2E on ${{ matrix.label }}
        run: bash scripts/run-distro-container.sh "${{ matrix.image }}" "${{ matrix.tag }}" "${{ matrix.mode }}" "$(ls dist/TextVN-*-linux-*.tar.gz | head -n1)" e2e-helpers x86_64

  # COMPAT-3: gõ tiếng Việt THẬT trong phiên desktop (không chỉ D-Bus như e2e_ibus) —
  # phím đi X server → GTK IM module → IBus → TextVN → ô soạn thảo của app thật, đọc lại qua
  # clipboard. Gói cài bằng chính install.sh của tarball. Case dùng chung macOS (tools/e2e/).
  e2e-desktop:
    name: E2E desktop gõ thật (${{ matrix.de }})
    needs: linux-adapters
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - de: xfce-x11
            pkgs: xvfb xfwm4 mousepad xdotool xclip ibus ibus-gtk3 dbus-x11 dbus-user-session
          - de: sway-wayland
            pkgs: sway wtype wl-clipboard fcitx5 fcitx5-modules mousepad dbus-user-session
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: textvn-linux-x86_64
          path: dist
      - name: Cài môi trường desktop (${{ matrix.de }})
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ${{ matrix.pkgs }} >/dev/null
      - name: Gõ thật (${{ matrix.de }})
        run: |
          set +e
          bash scripts/e2e-desktop.sh "${{ matrix.de }}" "$(ls dist/TextVN-*-linux-*.tar.gz | head -n1)"
          rc=$?
          if [ "$rc" = 3 ]; then
            # Mã 3 = GIỚI HẠN MÔI TRƯỜNG đo được TRƯỚC khi có IM (không phải lỗi TextVN) — ghi rõ,
            # không pass ngầm; lỗi sau khi TextVN tham gia vẫn là đỏ (mã khác 0).
            msg="${{ matrix.de }}: compositor headless + phím ảo không đưa phím tới app ngay cả khi CHƯA có IM (COMPAT-3)"
            echo "::warning title=COMPAT-3 giới hạn môi trường::$msg"
            { echo "### COMPAT-3 — ${{ matrix.de }}"; echo; echo "**GIỚI HẠN**: $msg."; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$rc"

  # E70: smoke gói phát hành trên LTS cũ ngoài ma trận E2E đầy đủ (glibc 2.31) —
  # ldd sạch cho 3 ELF baseline EL8, CLI chẩn đoán (--check-env/--diagnose/--export-log
  # không lộ PII), --check-abi, install.sh/uninstall.sh per-user (scripts/test-linux-smoke.sh).
  smoke-legacy-lts:
    name: Smoke tarball (${{ matrix.label }})
    needs: linux-adapters
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Ubuntu 20.04 LTS Focal / Mint 20
            image: ubuntu:20.04
          - label: Debian 11 Bullseye
            image: debian:11
            # E71: Debian 11 hết LTS (2026-08) — pool debian-security trên deb.debian.org
            # trả 404 trong khi index vẫn còn; gói thật chỉ còn ở archive.debian.org.
            apt_archive: bullseye
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: textvn-linux-x86_64
          path: dist
      - name: Run container smoke on ${{ matrix.label }}
        env:
          DISTRO_IMAGE: ${{ matrix.image }}
          APT_ARCHIVE: ${{ matrix.apt_archive || '' }}
        run: |
          TARBALL_NAME="$(basename "$(ls dist/TextVN-*-linux-*.tar.gz | head -n1)")"
          docker run --rm \
            -v "$PWD:/src:ro" \
            -e TARBALL_NAME="$TARBALL_NAME" \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -e APT_ARCHIVE="$APT_ARCHIVE" \
            "$DISTRO_IMAGE" bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              if [[ -n "$APT_ARCHIVE" ]]; then
                rm -f /etc/apt/sources.list.d/*
                printf "deb http://archive.debian.org/debian %s main\ndeb http://archive.debian.org/debian-security %s-security main\n" \
                  "$APT_ARCHIVE" "$APT_ARCHIVE" > /etc/apt/sources.list
                echo "Acquire::Check-Valid-Until \"false\";" > /etc/apt/apt.conf.d/99textvn-archive
              fi
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends \
                ibus libgtk-3-0 dbus dbus-x11 procps gawk dconf-cli xkb-data diffutils findutils tar gzip libdbus-1-3 ca-certificates >/dev/null
              groupadd -f -g "$HOST_GID" tester || true
              useradd -m -u "$HOST_UID" -g "$HOST_GID" -o tester
              su -s /bin/bash tester -c "LC_ALL=C.UTF-8 LANG=C.UTF-8 bash /src/scripts/test-linux-smoke.sh /src/dist/$TARBALL_NAME"
            '
