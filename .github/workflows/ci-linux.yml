# CI riêng Linux (tách khỏi ci-shared 2026-10-11 — README hiện badge từng nền tảng:
# Windows / Linux / macOS). Phạm vi: linux-common (C, ASan + UBSan) + adapter IBus/Fcitx5
# build với header thật, e2e với ibus-daemon/fcitx5 thật, gói tarball cài/chạy ngay.
# Job giữ NGUYÊN tên như khi còn trong ci-shared.
name: ci-linux

on:
  push:
    branches: [main]
    # Push chỉ chứa docs/graphify không đổi code — đừng đốt runner.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'graphify-out/**'
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Log không bao giờ chứa nội dung phím (S2) — biến này để tắt log nóng của engine.
  RUST_LOG: warn

permissions:
  contents: read

concurrency:
  group: ci-linux-${{ github.ref }}
  # main KHÔNG cancel-in-progress (giữ bằng chứng xanh cho từng commit); PR thì cancel.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-common-sanitizers:
    # R2-79: test C của linux-common (IPC client: SIGPIPE, frame dở dang, header) chạy
    # với ASan + UBSan — trước đây chỉ e2e build Release, lỗi bộ nhớ lọt qua.
    name: linux-common tests (ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release -p textvn-ffi
      - name: cmake Debug + -fsanitize=address,undefined → ctest
        run: |
          cmake -S adapters/linux-common -B build-asan -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-asan -j
          ctest --test-dir build-asan --output-on-failure

  linux-adapters:
    timeout-minutes: 90
    # Adapter IBus/Fcitx5 build với header THẬT (không mock) + kiểm thử đầu-cuối với
    # ibus-daemon / fcitx5 chạy thật trong dbus-run-session.
    name: Linux IBus/Fcitx5 (build + e2e + gói cài/chạy ngay)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      # Cache chuẩn Swatinem: job này build workspace + adapter Linux (e2e, gói)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        # E59: bump shared-key — cache cũ bị "độc" từ run abort (SIGABRT dict-entry
        # giữa build CMake để dangling symlinks test_*.dir/tests/target → cache
        # save/restore ENOENT). Key mới = bỏ hẳn cache đó.
        with:
          shared-key: e59-dbus-e2e-v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake pkg-config \
            libibus-1.0-dev libfcitx5core-dev libfcitx5utils-dev fcitx5-modules-dev \
            libgtk-4-dev ibus fcitx5 fcitx5-modules dbus libdbus-1-dev
      - run: scripts/e2e-linux.sh
      # E67: dựng binary EL8 (AlmaLinux 8 = RHEL 8.10 ABI: glibc 2.28, IBus 1.5.19, GTK3 3.22)
      # để gói tarball duy nhất chạy mượt từ RHEL 8.10 / Rocky 8 / Ubuntu 20-22 tới Ubuntu 24 / Arch.
      - name: Build EL8 baseline (RHEL 8.10 glibc 2.28 + GTK3)
        run: |
          cargo fetch --locked
          RUSTUP_DIR="$(rustup show home)"
          CARGO_DIR="${CARGO_HOME:-$HOME/.cargo}"
          HOST_UID="$(id -u)"
          HOST_GID="$(id -g)"
          docker run --rm \
            -v "$PWD:/src" \
            -v "$RUSTUP_DIR:/rustup:ro" \
            -v "$CARGO_DIR:/cargo" \
            -e HOST_UID="$HOST_UID" \
            -e HOST_GID="$HOST_GID" \
            almalinux:8 bash -euo pipefail -c '
              dnf --enablerepo=powertools install -y --setopt=install_weak_deps=False \
                gcc make cmake pkgconf-pkg-config ibus-devel gtk3-devel ibus dbus-daemon dbus-tools procps-ng gawk dconf xkeyboard-config >/dev/null
              groupadd -f -g "$HOST_GID" builder || true
              useradd -m -u "$HOST_UID" -g "$HOST_GID" -o builder
              mkdir -p /tmp/target-el8 && chown -R "$HOST_UID:$HOST_GID" /tmp/target-el8
              su -s /bin/bash builder -c "
                export PATH=/cargo/bin:\$PATH
                export RUSTUP_HOME=/rustup CARGO_HOME=/cargo CARGO_TARGET_DIR=/tmp/target-el8
                export LC_ALL=C.UTF-8 LANG=C.UTF-8
                bash /src/scripts/build-linux-el8.sh /src/target/linux-el8
              "
            '
      # Tarball đa distro (EL8 CLI + EL8 IBus + GTK3/GTK4 settings + Fcitx5) + kiểm ELF ABI ≤ glibc 2.28.
      - run: scripts/build-linux.sh --skip-tests --el8-dir target/linux-el8
      # 2 kịch bản người dùng (cài bằng install.sh / chạy ngay bằng textvn-portable.sh) × IBus + Fcitx5 trên Ubuntu 24.04.
      - run: scripts/test-linux-package.sh dist/TextVN-*-linux-*.tar.gz
      # E67: kiểm thử ĐÚNG gói phát hành đó bên trong AlmaLinux 8 (RHEL 8.10: glibc 2.28, Bash 4.4, IBus 1.5.19, không GTK4).
      - name: E2E final tarball on AlmaLinux 8 (RHEL 8.10)
        run: |
          TARBALL_NAME="$(basename "$(ls dist/TextVN-*-linux-*.tar.gz | head -n1)")"
          HOST_UID="$(id -u)"
          HOST_GID="$(id -g)"
          docker run --rm \
            -v "$PWD:/src:ro" \
            -e TARBALL_NAME="$TARBALL_NAME" \
            -e HOST_UID="$HOST_UID" \
            -e HOST_GID="$HOST_GID" \
            almalinux:8 bash -euo pipefail -c '
              dnf install -y --setopt=install_weak_deps=False \
                ibus gtk3 dbus-daemon dbus-tools procps-ng gawk dconf xkeyboard-config diffutils findutils tar gzip >/dev/null
              groupadd -f -g "$HOST_GID" tester || true
              useradd -m -u "$HOST_UID" -g "$HOST_GID" -o tester
              su -s /bin/bash tester -c "LC_ALL=C.UTF-8 LANG=C.UTF-8 bash /src/scripts/test-linux-el8-package.sh /src/dist/$TARBALL_NAME /src/target/linux-el8/ibus/e2e_ibus"
            '
      - uses: actions/upload-artifact@v4
        with:
          name: textvn-linux-x86_64
          path: dist/TextVN-*-linux-*.tar.gz*
          if-no-files-found: error
