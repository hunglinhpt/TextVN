# Simple Telex — Telex nhưng `w` CHỈ là dấu sừng (UniKey `SimpleTelexMethodMapping`:
# `{'W', vneHookAll}`; bamboo Simple Telex `w: UOA_ƯƠĂ`): `aw ow uw` → `ă ơ ư` như Telex.
# Nguồn: `core/src/method/simple_telex.rs` (P0-1 §1) — `telex::fold_with(w_marker=false)`.
# Vì `w_marker = false`: `w` không có âm nhận sừng là chữ `w` (`ww` → `ww`, không nuốt lặp)
# — khác Telex. Dấu thanh + đôi âm + `dd` giống hệt Telex → dùng chung bảng với `telex`.

[method]
name = "simple_telex"
display = "Simple Telex"
w_marker = false
tone = ["s", "f", "r", "x", "j"]
stroke_key = "d"
stroke_double = true
remove_marks_key = ""
# `z` gỡ dấu thanh như Telex.
tone_remove_key = "z"

[[circumflex]]
key = "a"
from = ["A"]
to = ["A_CIRC"]

[[circumflex]]
key = "e"
from = ["E"]
to = ["E_CIRC"]

[[circumflex]]
key = "o"
from = ["O"]
to = ["O_CIRC"]

# `w` sau âm gốc: aw→ă, ow→ơ, uw→ư (R2-61 — bản cũ bỏ bảng này nên không gõ được ă/ơ/ư).
[[horn]]
key = "w"
from = ["A", "O", "U"]
to = ["A_BREVE", "O_HOOK", "U_HOOK"]
