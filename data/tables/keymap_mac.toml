#
# keymap_mac.toml — keycode macOS (Carbon `kVK_*`, HIToolbox/Events.h) →
# VK canonical Windows (core/src/keymap.rs, P0-2 §1: "Win VK là canonical —
# adapter macOS chuẩn hóa về đây trước khi gọi engine").
#
# Nguồn sự thật duy nhất cho adapter macOS: `cargo xtask gen-tables` sinh
#   - core/src/keymap_mac_generated.rs
#   - adapters/macos-imk/Sources/CoreBridge/KeyMapMacGenerated.swift
# Sửa bảng → chạy lại gen-tables; `check-tables` (CI) chặn lệch nguồn.
#
# Chỉ map phím cần cho engine (chữ/số/dấu, điều hướng, modifier, F-keys).
# Keypad và media keys cố ý KHÔNG map → KeyTranslator trả nil → adapter PASS.
# Modifier trái/phải map về cùng VK (engine phân biệt qua IME_MOD_*);
# NGOẠI LỆ: Command/RightCommand → LWIN/RWIN (0x5B/0x5C) — giữ 2 VK riêng
# để keylog/doctor phân biệt phía trái/phải (mods vẫn là IME_MOD_META).

# ---- chữ cái (kVK_ANSI_A..Z → VK 'A'..'Z' = 0x41..0x5A) ----

