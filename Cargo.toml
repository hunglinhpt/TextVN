# SPDX-License-Identifier: GPL-3.0-or-later
[workspace]
resolver = "2"
members = [
    "core", "strategy", "config", "appdb", "ipc", "field-detect", "ffi", "cli", "xtask", "tools/bench",
    "adapters/windows-tsf", "adapters/windows-hook", "tray",
]

[workspace.package]
version = "0.2.10"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/hunglinhpt/TextVN"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
