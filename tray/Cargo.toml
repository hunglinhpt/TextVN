# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "vietime-tray"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[build-dependencies]
winresource = { version = "0.1", optional = true }

[features]
embed-resources = ["winresource"]


[[bin]]
name = "vietime-tray"
path = "src/main.rs"

[dependencies]
vietime-appdb = { path = "../appdb" }
vietime-config = { path = "../config" }
vietime-ipc = { path = "../ipc" }
vietime-strategy = { path = "../strategy" }
serde.workspace = true
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-core = "0.61"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_Storage_FileSystem",
    "Win32_Security",
] }
