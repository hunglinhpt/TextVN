# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "textvn-tray"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "TextVN"
path = "src/main.rs"

[dependencies]
textvn-appdb = { path = "../appdb" }
textvn-config = { path = "../config" }
textvn-ipc = { path = "../ipc" }
textvn-strategy = { path = "../strategy" }
serde.workspace = true
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-core = "0.61"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    # CoTaskMemFree cho SHGetKnownFolderPath (gốc Program Files tin cậy — R2-03/R2-15).
    "Win32_System_Com",
] }
