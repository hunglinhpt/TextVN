version = 1
SPDX-PackageName = "TextVN"
SPDX-PackageSupplier = "https://github.com/hunglinhpt"
SPDX-PackageDownloadLocation = "https://github.com/hunglinhpt/TextVN"

[[annotations]]
path = ["**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 LinhBH.CoM"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Danh sách từ điển tiếng Việt (vi-DauCu.dic / vi-DauMoi.dic) — nguồn:
# Dự án Từ điển tiếng Việt miễn phí do Hồ Ngọc Đức bảo quản, đóng gói
# thành Hunspell bởi Ivan Garcia và Nguyễn Xuân Minh (1ec5/hunspell-vi,
# LibreOffice/dictionaries vi/). Phát hành theo GNU GPL phiên bản 2,
# tương thích với GPL-3.0-or-later của TextVN (được dùng dưới điều khoản GPLv2).
[[annotations]]
path = ["data/assist/*.dic"]
precedence = "override"
SPDX-FileCopyrightText = ["Hồ Ngọc Đức (Free Vietnamese Dictionary Project)", "Ivan Garcia", "Nguyễn Xuân Minh"]
SPDX-License-Identifier = "LicenseRef-hunspell-vi"

# Bản dịch tiếng Việt của Inno Setup (jrsoftware/issrc Files/Languages/Unofficial) — giữ
# nguyên giấy phép Inno Setup của nó, không phải GPL của TextVN.
[[annotations]]
path = ["installer/windows/languages/Vietnamese.isl"]
precedence = "override"
SPDX-FileCopyrightText = ["1997-2026 Jordan Russell", "2023 memecoder (Vietnamese translation)"]
SPDX-License-Identifier = "LicenseRef-InnoSetup"

# Corpus đo FPR/recall lấy từ Tatoeba (export per-language vie_sentences.tsv.bz2).
# Dữ liệu câu của Tatoeba phát hành dưới **CC BY 2.0 FR** ⇒ attribution BẮT BUỘC
# và KHÔNG phải GPL của TextVN. Annotation này GHI ĐÈ blanket "**" (GPL-3.0-or-later)
# cho đúng 3 file này — "override" + đặt SAU blanket trong file là bắt buộc:
# reuse chỉ dùng annotation khớp CUỐI CÙNG (find_annotations_item quét ngược).
# Attribution đầy đủ: docs/compliance/tatoeba-attribution.md + LICENSES/LicenseRef-Tatoeba.txt
# + header của từng file corpus.
[[annotations]]
path = [
    "corpus/assist/vi_tatoeba_clean.ass",
    "corpus/assist/vi_real_clean.ass",
    "corpus/assist/vi_real_errors.ass",
]
precedence = "override"
SPDX-FileCopyrightText = [
    "Tatoeba contributors (tatoeba.org) — câu tiếng Việt trong export vie_sentences.tsv.bz2",
    "2026 LinhBH.CoM — tập lọc/gán nhãn (đạo hình thức)",
]
SPDX-License-Identifier = "LicenseRef-Tatoeba"

# Corpus EN lấy từ Tatoeba (export per_language eng_sentences.tsv.bz2) — cùng
# pattern CC BY 2.0 FR như block tiếng Việt phía trên (attribution bắt buộc).
# CHỈ en_real_clean.ass chứa câu Tatoeba thật (sinh bởi
# tools/assist/gen_corpus_en_tatoeba.py); các file en_basic.ass /
# en_real_errors.ass / en_proposed_rules.ass do agent tự viết → dùng blanket
# GPL-3.0-or-later ở đầu file.
[[annotations]]
path = ["corpus/assist/en_real_clean.ass"]
precedence = "override"
SPDX-FileCopyrightText = [
    "Tatoeba contributors (tatoeba.org) — câu tiếng Anh trong export eng_sentences.tsv.bz2",
    "2026 LinhBH.CoM — tập lọc/chọn mẫu (đạo hình thức)",
]
SPDX-License-Identifier = "LicenseRef-Tatoeba"
